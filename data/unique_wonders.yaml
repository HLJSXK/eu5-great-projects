      name_en: Oath of the Acropolis
      name_zh: 卫城誓约
      desc_en: The ruler climbs the Acropolis with the city's notables and swears before the Parthenon's columns to protect its marble. The pledge is written down while the crowd below acclaims the guardian of Athens.
      desc_zh: 君主偕城中显贵登上卫城，在帕特农柱廊前立誓守护山上的大理石古迹。誓言当场录入文书，山下民众齐声称颂这位雅典的守护者。
    2:
      name_en: Dedication of the Sacred Rock
      name_zh: 圣岩奉献礼
      desc_en: Clergy lead a procession up the sacred rock and dedicate the ancient sanctuary anew, appointing keepers to tend its lamps, receive pilgrims, and repair the building season by season.
      desc_zh: 教士率领游行队伍登上圣岩，为这座古老圣所重新祝圣，并委派专人看守灯火、接待朝圣者，一年四季轮番修缮殿宇。
    3:
