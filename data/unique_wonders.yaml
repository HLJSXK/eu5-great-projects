      desc_en: The first kiln-load of blue-and-white is packed in straw and rice husk, shipped down the Chang River to Poyang Lake, and sold to the merchants waiting downstream.
      desc_zh: 首窑青花用稻草和谷壳裹好装箱，顺昌江运进鄱阳湖，卖给早已在下游等候的各路客商。
