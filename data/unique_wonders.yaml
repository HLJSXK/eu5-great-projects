unique_wonders:
- id: 101
  key: unique_pharos_lighthouse
  base_key: great_lighthouse
  concept: tv_wonder_unique_pharos_lighthouse
  location: alexandria
  image: tv_wonder_unique_pharos_lighthouse
  prompt: The Pharos Lighthouse of Alexandria in its Hellenistic prime, a colossal white stone lighthouse on Pharos island above a busy ancient harbor, bronze mirror beacon lit at dusk, Ptolemaic ships, seawalls, Alexandria skyline, historically grounded world wonder key art, cinematic coastal panorama, ultra-detailed, realistic materials, no modern elements.
  is_unique: true
  initial_level: 0
  mechanic_key: great_lighthouse
  base_effect_multiplier: 2
  vanilla_carriers:
  - kind: building
    key: lighthouse_of_alexandria
    mode: replace
  final_building: tv_wonder_unique_pharos_lighthouse_inaugurated
  ritual_text:
    1:
      name_en: Harbor Lighting Rite
      name_zh: 港口点灯典礼
      desc_en: On the day of completion the court lights the summit fire before the whole harbor, with foreign envoys and ship captains of every flag invited onto the island to watch.
      desc_zh: 落成之日，宫廷当着满港船只点燃塔顶之火，各国使节和船长都受邀登岛观礼。
    2:
      name_en: Pilots' Oath
      name_zh: 领航誓约
      desc_en: Alexandria's harbor pilots swear their oath beneath the tower, keeping a seasonal record of the shoals and taking every incoming ship through the narrows themselves.
      desc_zh: 亚历山大港的领航员在塔下立誓，按季节记录浅滩位置，凡入港船只都由他们亲自引过水道。
    3:
      name_en: The Night Fire Watch
      name_zh: 通宵守火
      desc_en: On the first night the keepers feed the fire in shifts until dawn, and ships far out at sea see Alexandria in the dark for the first time.
      desc_zh: 落成当夜，守火人轮班添柴直到天明，远海的船只第一次在夜里望见了亚历山大港。
- id: 102
  key: unique_hagia_sophia
  base_key: sky_dome_grand_temple
  concept: tv_wonder_unique_hagia_sophia
  location: constantinople
  image: tv_wonder_unique_hagia_sophia
  prompt: Hagia Sophia in medieval Constantinople after Justinian's rebuilding, immense central dome, golden mosaics, marble columns, clergy and imperial officials at a dedication prayer, Byzantine city walls and the Bosporus beyond, historically grounded world wonder key art, cinematic interior-exterior cutaway feel, ultra-detailed, no modern elements.
  is_unique: true
  initial_level: 1
  mechanic_key: sky_dome_grand_temple
  base_effect_multiplier: 2
  vanilla_carriers:
  - kind: art
    key: hagia_sophia
    mode: replace
  final_building: tv_wonder_unique_hagia_sophia_inaugurated
  identity_variants:
  - key: mosque
    global_variable: hagia_sophia_now_mosque
    eligible_script: |
      religion.group = religion_group:muslim
      location:constantinople = { dominant_religion.group = religion_group:muslim }
    restore_script: religion.group = religion_group:christian
    cost_scale: 1.2
    reward_script: |
      change_societal_value = { type = mysticism_vs_jurisprudence value = societal_value_tiny_move_to_right }
      add_prestige = prestige_extreme_bonus
      add_estate_satisfaction = { type = estate_type:clergy_estate value = estate_satisfaction_mild_bonus }
    vanilla_event:
      path: in_game/events/government/mysticism_vs_jurisprudence.txt
      id: mysticism_vs_jurisprudence.21
      option: mysticism_vs_jurisprudence.21.a
    name_en: Hagia Sophia Grand Mosque
    name_zh: 圣索菲亚大清真寺
    desc_en: The great dome of Constantinople now shelters Friday prayer. Its ancient marble and vaults endure, while the call to prayer and a pious endowment give the building a new place in the city's life.
    desc_zh: 君士坦丁堡的宏伟穹顶如今庇护着聚礼。古老的大理石与拱顶依然矗立，宣礼声与宗教善产则赋予它在城市生活中的新身份。
    decision_en: Convert Hagia Sophia into a Mosque
    decision_zh: 将圣索菲亚转化为清真寺
    decision_desc_en: Endow the completed Hagia Sophia as a grand mosque. Pay the conversion cost and gain prestige and clergy satisfaction. Its building and current level are preserved; the previous dedication is revoked, and a new rite can be chosen through Rededicate a Wonder. Christian ownership or conversion of the owner to Christianity restores its church identity automatically.
    decision_desc_zh: 出资将已落成的圣索菲亚改为大清真寺，获得威望与教士满意度。建筑及当前等级保留，原有奉献仪式撤销；之后可通过重新奉献奇观选择新的仪式。基督教国家取得此地，或所有者改宗基督教时，将自动恢复教堂身份。
    image: tv_wonder_unique_hagia_sophia_mosque
    prompt: Preserve the recognizable Hagia Sophia architecture, warm painterly brushwork, blue sky, golden light, street-level viewpoint and landscape framing. Depict the building as an Ottoman imperial mosque with minarets and crescent finials, a small dignified procession of Ottoman worshippers approaching the entrance and a fountain courtyard, period appropriate clothing, no modern objects, writing or watermark. Keep the great dome the main focus.
    ritual_text:
      1:
        name_en: First Friday Prayer
        name_zh: 首次聚礼
        desc_en: Scholars and worshippers gather beneath the great dome for Friday prayer. The sermon names the ruler, and voices from every province answer together beneath the ancient vaults.
        desc_zh: 学者与信众齐聚宏伟穹顶下举行聚礼。讲坛上宣读统治者之名，来自各行省的声音在古老拱顶下共同应答。
      2:
        name_en: Endowment of the Mosque Kitchen
        name_zh: 清真寺施食善产
        desc_en: The mosque's trustees register a pious endowment for its kitchens, fountains, and lamps. Bread and hot meals are distributed at the gates to the poor and to travelers.
        desc_zh: 清真寺受托人为厨房、泉亭与长明灯登记宗教善产，在门前向穷人与旅人分发面包和热食。
      3:
        name_en: Council beneath the Great Dome
        name_zh: 穹顶议事
        desc_en: Judges, scholars, and the elders of the city's quarters meet in the mosque courtyard to settle endowment accounts, water rights, and market dues before entering the prayer hall together.
        desc_zh: 法官、学者与城中各区长老在清真寺庭院会面，议定善产账目、用水权与市集规费，再一同进入礼拜殿。
  ritual_text:
    1:
      name_en: Justinianic Synaxis
      name_zh: 查士丁尼圣会
      desc_en: Clergy from every diocese of the realm gather beneath the new dome for a synaxis, each bringing a candle and a hymn of their region, which the choir then sings together in the court's tongue.
      desc_zh: 全国各教区的神职人员齐聚新穹顶下举行圣会，各自带来一支蜡烛和一首家乡圣歌，再由唱诗班用宫廷语言合唱。
    2:
      name_en: Imperial Gate Alms
      name_zh: 帝王门施赈
      desc_en: The church wardens open the alms chests at the Imperial Gate, handing out bread and coin to the city's poor and entering every pilgrim's offering in the sacristy ledger.
      desc_zh: 教堂执事在帝王门前打开济贫箱，向城中穷人分发面包和钱币，朝圣者的每一笔献金都记入圣器室账册。
    3:
      name_en: South Gallery Council
      name_zh: 南廊会议
      desc_en: Bishops, magistrates, and guild elders take their seats in the south gallery where synods once met, settle the city's disputes over tithes and dues, then descend together into the nave.
      desc_zh: 主教、官员和行会长老在昔日召开宗教会议的南廊落座，调解城中有关什一税与各项规费的争执，再一同走下中殿。
- id: 103
  key: unique_dome_of_the_rock
  base_key: sky_dome_grand_temple
  concept: tv_wonder_unique_dome_of_the_rock
  location: jerusalem
  image: tv_wonder_unique_dome_of_the_rock
  prompt: The Dome of the Rock on Jerusalem's sacred platform, polished golden dome, blue and gold tilework, pilgrims moving through arcades, early medieval stone courtyards, city hills in warm light, historically grounded world wonder key art, respectful cinematic view, ultra-detailed, no modern elements.
  is_unique: true
  initial_level: 1
  mechanic_key: sky_dome_grand_temple
  base_effect_multiplier: 2
  final_building: tv_wonder_unique_dome_of_the_rock_inaugurated
  ritual_text:
    1:
      name_en: Sanctuary Dome Pilgrimage
      name_zh: 圣殿封顶朝觐
      desc_en: Once the gilded dome is set, pilgrims from every province of the realm enter by the four doors and walk the octagonal ambulatory around the rock together in one procession.
      desc_zh: 金顶落定之后，来自全国各地的朝圣者从四座门进入，沿八角回廊围绕圣岩同行一周。
    2:
      name_en: Waqf of the Fountains
      name_zh: 泉亭善产
      desc_en: The keepers of the platform place the pilgrims' offerings in a pious endowment that pays for the drinking fountains, the lamp oil, and the hostels where travelers lodge in the old city.
      desc_zh: 圣台管理人把朝圣者的献金设为宗教善产，用来供养饮水泉亭和长明灯油，并资助老城里接待旅人的客栈。
    3:
      name_en: Holy City Elders' Council
      name_zh: 圣城长老会
      desc_en: Judges, scholars, and the heads of the city's quarters meet beneath the arcades of the platform to settle how pilgrim tolls, water rights, and market dues are shared.
      desc_zh: 法官、学者和城中各区首领在圣台拱廊下聚会，议定朝圣税、用水权和市集规费如何分配。
- id: 104
  key: unique_angkor_wat
  base_key: giant_tower_temple
  concept: tv_wonder_unique_angkor_wat
  location: angkor
  image: tv_wonder_unique_angkor_wat
  prompt: Angkor Wat at the height of the Khmer Empire, five lotus towers reflected in wide moats, carved galleries, processional causeway, royal temple ceremony, tropical forest edges, historically grounded world wonder key art, cinematic sunrise, ultra-detailed stone reliefs, no modern elements.
  is_unique: true
  initial_level: 1
  mechanic_key: giant_tower_temple
  base_effect_multiplier: 2
  final_building: tv_wonder_unique_angkor_wat_inaugurated
  ritual_text:
    1:
      name_en: Devaraja Temple Entrance
      name_zh: 国王神格化入殿仪式
      desc_en: The ruler walks the western causeway into the central tower as the realm's god-king while lamps are lit on all five towers, and the army's banners are blessed in the galleries.
      desc_zh: 统治者沿西侧堤道以神王之身步入中央塔殿，五座塔顶同时点灯，军旗也在回廊中接受祝福。
    2:
      name_en: Upper Sanctuary Ascent
      name_zh: 登顶朝圣
      desc_en: Villagers from the surrounding rice lands climb the steep stairs to the upper sanctuary, led along the bas-reliefs by temple priests who recite each carved story in the Khmer tongue.
      desc_zh: 周边稻田村落的百姓攀上陡峭石阶直达上层圣殿，祭司领着他们沿浮雕回廊走过，用高棉语讲述每段石刻故事。
    3:
      name_en: Palm-Leaf School
      name_zh: 贝叶学堂
      desc_en: Monks open a school in the galleries, where village boys copy texts onto palm leaves and learn the calendar of rites, harvests, and the opening of the reservoir gates.
      desc_zh: 僧侣在回廊里开设学堂，村中少年在贝叶上抄写经文，学习祭典、农时与水库开闸的历法。
- id: 105
  key: unique_potala_palace
  base_key: sacred_mountain
  concept: tv_wonder_unique_potala_palace
  location: lhasa
  image: tv_wonder_unique_potala_palace
  prompt: The Potala Palace above Lhasa, white and red palace-monastery terraces rising on Marpo Ri hill, Tibetan monks, banners, ceremonial procession, high plateau light and mountains, historically grounded world wonder key art, cinematic aerial view, ultra-detailed, no modern elements.
  is_unique: true
  initial_level: 0
  mechanic_key: sacred_mountain
  base_effect_multiplier: 2
  final_building: tv_wonder_unique_potala_palace_inaugurated
  ritual_text:
    1:
      name_en: Dalai Lama Enthronement
      name_zh: 达赖坐床典礼
      desc_en: The realm's highest lama is seated on the lion throne in the Great West Hall, and the noble houses lay their seals and land grants before the throne to be confirmed anew.
      desc_zh: 全国地位最高的喇嘛在西大殿登上狮子宝座，各贵族家族把印信和封地文书呈于座前，等候重新确认。
    2:
      name_en: Red Palace Retreat
      name_zh: 红宫闭关
      desc_en: Monks from the great monasteries around Lhasa enter retreat in the chapels of the Red Palace, while novices are ordained in the courtyard to fill the new prayer halls.
      desc_zh: 拉萨周边各大寺院的僧人进入红宫诸佛堂闭关修行，新沙弥在庭院中受戒，充实新建的经堂。
    3:
      name_en: Great Thangka Unveiling
      name_zh: 展佛大典
      desc_en: At dawn the monks unroll a giant appliqué thangka down the south wall of the palace, and the crowds on the plain receive its blessing as the ruler's mandate is proclaimed from the terraces.
      desc_zh: 黎明时分，僧众将巨幅堆绣唐卡沿宫殿南墙垂下，山下人群在佛像前领受加持，同时聆听统治者受命的宣告。
- id: 106
  key: unique_alhambra
