      desc_en: On festival days laypeople from every quarter of the city climb the inner stair floor by floor, bowing to the glazed Buddha images set into each level and leaving incense at the top.
      desc_zh: 每逢节日，城中各坊的善男信女沿塔内楼梯逐层攀登，向每层的琉璃佛像礼拜，最后在塔顶敬香。
