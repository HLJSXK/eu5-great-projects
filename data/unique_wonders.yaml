      name_zh: 圜丘大祀
      desc_en: Before dawn on the winter solstice the ruler ascends the Circular Mound to offer jade, silk and a burnt sacrifice, while the court stands in silence on the terraces below.
      desc_zh: 冬至黎明前，君主登上圜丘，献上玉帛与燔牲，文武百官在下层台阶上分班肃立，全场寂静无声。
    2:
      name_en: Spring Prayer for Grain
      name_zh: 孟春祈谷
      desc_en: In the first month the ruler prays for the year's harvest in the triple-eaved hall, and on the same day the court hands out relief grain to poor households of the outer city.
      desc_zh: 正月上辛日，君主在三重檐的祈年殿为一年收成祈祷，宫廷同日向外城的贫苦人家发放赈米。
    3:
      name_en: Palace of Abstinence Fast
      name_zh: 斋宫致斋
      desc_en: Before the great rite the ruler and the ministers keep the prescribed fast, the ruler lodging in the Palace of Abstinence, taking no meat, wine or music and hearing no criminal cases.
      desc_zh: 大祀之前，君主与群臣按礼致斋，君主宿于斋宫，期间不饮酒、不食荤、不听乐，也不审理刑狱。
