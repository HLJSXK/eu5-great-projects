    key: alhambra_palace
    mode: replace
  - kind: building
    key: alhambra
    mode: replace
  final_building: tv_wonder_unique_alhambra_inaugurated
  ritual_text:
    1:
      name_en: Treaty of Granada Signing
      name_zh: 格拉纳达投降条约签署
      desc_en: In the Hall of the Ambassadors beneath the cedar dome, the rulers of subject lands sign their compacts with the crown, and each copy is sealed and kept in the palace chancery.
      desc_zh: 在雪松木穹顶下的使节厅里，各附属领地的君主与王室签订盟约，每份文本加盖印信后存入宫中文书房。
    2:
      name_en: Myrtle Court Gifts
      name_zh: 桃金娘庭献礼
      desc_en: Along the long pool of the Court of the Myrtles, Albaicín weavers and Alcaicería silk merchants lay out silks, glazed ceramics, and sugar as gifts for visiting envoys.
      desc_zh: 桃金娘中庭的水池两侧，阿尔拜辛区的织工和丝绸市场的商人摆出丝绸、釉陶与蔗糖，作为赠给来访使节的礼物。
    3:
      name_en: Generalife Garden Audience
      name_zh: 夏宫花园会见
      desc_en: The ruler receives foreign envoys one by one in the Generalife gardens, learning their customs over sherbet and fruit before lodging them in houses below the palace walls.
      desc_zh: 统治者在赫内拉利费花园逐一接见外国使节，借着果子露和鲜果了解各国风俗，再把他们安置在宫墙下的宅院中。
- id: 107
  key: unique_machu_picchu
  base_key: sacred_mountain
  concept: tv_wonder_unique_machu_picchu
  location: picchu
  image: tv_wonder_unique_machu_picchu
  prompt: Machu Picchu in the Inca era, royal stone citadel on a steep Andean ridge, precise dry-stone walls, terraces, temples, Inti Raymi sun ceremony, clouds and mountains, historically grounded world wonder key art, cinematic aerial view, ultra-detailed, no modern elements.
  is_unique: true
  initial_level: 0
  mechanic_key: sacred_mountain
  base_effect_multiplier: 2
  final_building: tv_wonder_unique_machu_picchu_inaugurated
  ritual_text:
    1:
      name_en: Inti Raymi
      name_zh: 太阳节Inti Raymi
      desc_en: At the winter solstice the ruler greets the rising sun at the Intihuatana stone, and the lords of the provinces offer llamas and chicha before swearing to hold their lands at the ruler's word.
      desc_zh: 冬至那天，统治者在拴日石旁迎接日出，各地领主献上羊驼和玉米酒，宣誓所领土地皆听凭统治者处置。
    2:
      name_en: Condor Temple Vigil
      name_zh: 神鹰殿守夜
      desc_en: Priests and chosen women take up residence in the stone houses beside the Temple of the Condor, fasting in turns and keeping the sacred fire through the cold nights on the ridge.
      desc_zh: 祭司与贞女住进神鹰殿旁的石屋，在山脊的寒夜里轮流斋戒，看守圣火不让它熄灭。
    3:
      name_en: Three Windows Mandate
      name_zh: 三窗殿受命
      desc_en: At the Temple of the Three Windows, priests read the signs of the sunlight through the openings and declare the ruler's reign confirmed, while runners carry the word down to the valley towns.
      desc_zh: 祭司在三窗殿前透过窗口观察日光征兆，宣告统治者的权位得到确认，信使随即把消息带往山下各镇。
- id: 108
  key: unique_himeji_castle
  base_key: star_fortress_city
  concept: tv_wonder_unique_himeji_castle
  location: shikama
  image: tv_wonder_unique_himeji_castle
  prompt: Himeji Castle in early modern Japan, white heron keep complex, layered roofs, defensive gates, stone walls, samurai reception procession entering the castle, Harima landscape, historically grounded world wonder key art, cinematic clear daylight, ultra-detailed, no modern elements.
  is_unique: true
  initial_level: 0
  mechanic_key: star_fortress_city
  base_effect_multiplier: 2
  final_building: tv_wonder_unique_himeji_castle_inaugurated
  ritual_text:
    1:
      name_en: Castle Reception Ceremony
      name_zh: 入城接收式
      desc_en: The garrison formally receives the castle keys at the Hishi Gate, and envoys of neighboring lords are walked through the maze of baileys to see a fortress built for holding ground, not marching out.
      desc_zh: 守军在菱之门正式接过城钥，邻国领主的使者被领着走过层层曲折的曲轮，亲眼看到这是一座为守而建的城。
    2:
      name_en: Maze Gate Drill
      name_zh: 迷城攻防演练
      desc_en: Garrison companies storm the castle against its own defenders, testing the winding paths, stone-drop chutes, and loopholes of every gate until each weak point has been shored up.
      desc_zh: 守军分作攻守两方，沿迂回坡道攻城，逐一检验各门的落石口和射孔，直到每处薄弱点都被加固。
    3:
      name_en: West Bailey Review
      name_zh: 西之丸阅兵
      desc_en: Armorers open the storehouses in the turrets, and the retainers parade in full armor on the western bailey with freshly issued matchlocks, bows, and spears.
      desc_zh: 工匠打开各橹中的军械库，家臣们身披甲胄，手持新发的火绳枪、弓与长枪在西之丸列队受阅。
- id: 109
  key: unique_taj_mahal
