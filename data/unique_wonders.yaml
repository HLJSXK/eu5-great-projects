      name_zh: 鱼嘴分水仪式
      desc_en: At Qingming the weir keepers cut the ropes of the wooden tripod cofferdams at the Fish Mouth, and the water rushes into the inner river toward the fields while villages along it set off firecrackers.
      desc_zh: 清明时节，堰工砍断鱼嘴前杩槎的绳索，江水涌入内江奔向平原农田，沿岸村庄燃放鞭炮相迎。
    2:
      name_en: Opening the Branch Canals
      name_zh: 开渠分田
      desc_en: Below the Bottle-Neck the water is led into a fan of new branch canals, and settlers drain the low marshes of the plain into rice paddies, each village drawing water by turns.
      desc_zh: 宝瓶口以下新开出成扇形分布的支渠，移民把平原上的低洼沼地排干改成稻田，各村按轮次分水灌溉。
    3:
      name_en: Turning the Mill Wheels
      name_zh: 水碾开轮
      desc_en: Millwrights set water wheels along the channels below the weir, and the first rice is hulled and rapeseed pressed by the current alone, in time for the market in Chengdu.
      desc_zh: 水车匠在堰下渠道两岸架起水碾，第一批稻谷靠水流舂成白米，菜籽也榨出了油，正好赶上成都的集市。
