  image: tv_wonder_unique_taj_mahal
  prompt: The Taj Mahal at Agra in the Mughal era, white marble mausoleum, reflecting pool, charbagh gardens, Yamuna river, royal memorial unsealing ceremony, intricate pietra dura, historically grounded world wonder key art, cinematic dawn, ultra-detailed, no modern elements.
  is_unique: true
  initial_level: 0
  mechanic_key: giant_necropolis
  base_effect_multiplier: 2
  vanilla_carriers:
  - kind: art
    key: taj_mahal
    mode: replace
  final_building: tv_wonder_unique_taj_mahal_inaugurated
  ritual_text:
    1:
      name_en: Royal Memorial Unsealing
      name_zh: 皇家追悼启封仪式
      desc_en: The court unseals the crypt beneath the main chamber and lays the royal dead to rest below the marble cenotaphs, while reciters keep vigil under the dome through the night.
      desc_zh: 宫廷启封主殿下的墓室，将王室逝者安葬在大理石衣冠冢下方，诵经人在穹顶下彻夜守灵。
    2:
      name_en: Anniversary Garden Fair
      name_zh: 陵园忌辰集市
      desc_en: On the anniversary of the burial the garden gates open to the people of Agra, and the tomb's endowment feeds the crowds from bazaar stalls set up in the forecourt.
      desc_zh: 每逢下葬周年，陵园大门向阿格拉百姓敞开，陵墓的供养田产出资，在前庭集市为来客施食。
    3:
      name_en: Yamuna Night Silence
      name_zh: 亚穆纳静夜
      desc_en: For one night the gardens are cleared of everyone but the custodians, and the ruler alone walks the water channel to the tomb by lamplight to honor the ancestors of the line.
      desc_zh: 这一夜陵园里只留守陵人，统治者独自提灯沿水渠走向陵墓，向王朝先人致祭。
