  location: granada
  image: tv_wonder_unique_alhambra
  prompt: The Alhambra palace in Granada, red fortress walls, Nasrid courtyards, Court of the Lions, carved stucco, reflecting pools, treaty ceremony with envoys, Sierra Nevada backdrop, historically grounded world wonder key art, cinematic warm evening light, ultra-detailed, no modern elements.
