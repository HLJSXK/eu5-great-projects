      name_en: Capital Transfer Ceremony
      name_zh: 迁都大典
      desc_en: The court enters the new palace through the Meridian Gate, and envoys of tributary states follow in fixed ranks to present their tribute before the Hall of Supreme Harmony.
      desc_zh: 宫廷经午门迁入新宫，各藩属国使节按班次随行，在太和殿前依次呈献贡物。
    2:
      name_en: Meridian Gate Victory Rite
