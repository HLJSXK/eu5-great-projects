      desc_zh: 档案馆长将首批登记簿封入新建库房，宫廷随即下令境内各处文书房把所藏文书的目录抄送到这里。
    2:
      name_en: Scriptors' Benches
      name_zh: 誊写席位
      desc_en: Paid benches for scriptors are set up in the reading galleries, where young clerks of the city copy worn registers onto fresh parchment and learn the chancery hand as they go.
      desc_zh: 阅览长廊里设了有俸禄的誊写席，城中年轻书记员在这里把破旧的登记簿誊上新羊皮纸，顺带学会公文笔法。
    3:
      name_en: Originals Called Home
      name_zh: 文书归档令
      desc_en: Envoys, governors and bishops are ordered to send back their original letters and charters, and archivists spend the first season sorting cartloads of loose papers onto the new shelves.
      desc_zh: 使节、总督与主教奉命交回手中的原件信函与特许状，档案员用了整整一季，把一车车散乱文书分类上架。
