#gp-single-flow { --graph-zoom:.1; width:100%; height:100vh; min-height:520px; display:flex; flex-direction:column; overflow:hidden; color:var(--foreground); background:var(--background); font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,&quot;Microsoft YaHei&quot;,sans-serif; }
#gp-single-flow * { box-sizing:border-box; }
#gp-single-flow button { font:inherit; }
#gp-single-flow .sg-header { flex:none; padding:18px 22px 14px; border-bottom:1px solid var(--border); }
#gp-single-flow .sg-title-line { display:flex; align-items:baseline; flex-wrap:wrap; gap:12px; }
#gp-single-flow h1 { margin:0; font-size:22px; font-weight:500; }
#gp-single-flow h1 span { margin-left:10px; font-size:16px; font-weight:400; color:var(--muted-foreground); }
#gp-single-flow .sg-count { margin-left:auto; color:var(--muted-foreground); font-size:12px; }
#gp-single-flow .sg-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-top:14px; }
#gp-single-flow .sg-tools { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
#gp-single-flow .sg-button { padding:7px 11px; border:1px solid var(--border); border-radius:6px; background:var(--background); color:var(--foreground); cursor:pointer; font-size:13px; }
#gp-single-flow .sg-button:hover,#gp-single-flow .sg-neighbor:hover { background:var(--accent); color:var(--accent-foreground); }
#gp-single-flow .sg-zoom { display:flex; gap:5px; align-items:center; margin-left:7px; }
#gp-single-flow output { min-width:40px; text-align:center; font-size:12px; font-variant-numeric:tabular-nums; }
#gp-single-flow .sg-help { margin-left:auto; color:var(--muted-foreground); font-size:12px; }
#gp-single-flow .sg-workspace { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 310px; }
#gp-single-flow .sg-canvas { min-height:0; height:100%; width:100%; position:relative; }
#gp-single-flow .react-flow { background:transparent; --xy-attribution-background-color:var(--background); --xy-selection-background-color:transparent; --xy-selection-border:0; }
#gp-single-flow .react-flow__edges { width:100%; height:100%; }
#gp-single-flow .react-flow__edges&gt;svg { width:100%; height:100%; max-width:none; overflow:visible; }
#gp-single-flow .react-flow__handle { opacity:0; pointer-events:none; }
#gp-single-flow .react-flow__node { font-family:inherit; border:none; box-shadow:none; }
#gp-single-flow .react-flow__node-region { pointer-events:none; }
#gp-single-flow .sg-region { width:100%; height:100%; border:calc(1px / var(--graph-zoom)) solid var(--border); border-radius:14px; background:color-mix(in srgb,var(--foreground) 2.5%,var(--background)); }
#gp-single-flow .sg-region-title { position:absolute; left:20px; top:12px; max-width:calc(100% - 40px); font-size:clamp(24px,calc(13px / var(--graph-zoom)),90px); line-height:1.05; font-weight:500; color:var(--foreground); }
#gp-single-flow .sg-region-caption { position:absolute; left:22px; top:84px; font-size:12px; color:var(--muted-foreground); }
#gp-single-flow .sg-step { width:100%; height:100%; padding:10px 12px; border:1px solid var(--border); border-radius:7px; background:var(--background); color:var(--foreground); display:flex; flex-direction:column; justify-content:center; gap:6px; cursor:pointer; }
#gp-single-flow .kind-player { background:color-mix(in srgb,var(--viz-series-1) 8%,var(--background)); }
#gp-single-flow .kind-auto { background:color-mix(in srgb,var(--viz-series-2) 7%,var(--background)); }
#gp-single-flow .kind-gate { background:color-mix(in srgb,var(--viz-series-3) 8%,var(--background)); border-radius:18px; }
#gp-single-flow .kind-state,#gp-single-flow .kind-wait { border-radius:28px; }
#gp-single-flow .is-focused { outline:3px solid var(--viz-series-1); outline-offset:3px; }
#gp-single-flow .sg-node-meta { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted-foreground); }
#gp-single-flow .sg-node-meta&gt;span:last-child { margin-left:auto; }
#gp-single-flow .sg-node-title { font-size:14px; font-weight:500; line-height:1.35; overflow-wrap:anywhere; }
#gp-single-flow .sg-dot { display:inline-block; width:7px; height:7px; flex:none; border-radius:50%; background:var(--muted-foreground); }
#gp-single-flow .dot-player { background:var(--viz-series-1); }
#gp-single-flow .dot-auto { background:var(--viz-series-2); }
#gp-single-flow .dot-gate { background:var(--viz-series-3); border-radius:0; transform:rotate(45deg); }
#gp-single-flow .sg-edge-label { position:absolute; pointer-events:none; background:var(--background); color:var(--foreground); padding:3px 6px; max-width:210px; font-size:13px; text-align:center; }
#gp-single-flow .sg-edge-label.is-dim { opacity:.35; }
#gp-single-flow[data-scale=&quot;overview&quot;] .sg-edge-label:not(.is-lit) { visibility:hidden; }
#gp-single-flow[data-scale=&quot;overview&quot;] .sg-region-caption { visibility:hidden; }
#gp-single-flow .sg-cross-label.is-lit { outline:1px solid var(--viz-series-1); }
#gp-single-flow .react-flow__minimap { width:175px; height:125px; border:1px solid var(--border); box-shadow:none; }
#gp-single-flow .react-flow__attribution { background:var(--background); color:var(--muted-foreground); }
#gp-single-flow .react-flow__attribution a { color:inherit; }
#gp-single-flow .sg-inspector { min-height:0; overflow-y:auto; padding:20px; border-left:1px solid var(--border); background:var(--background); }
#gp-single-flow .sg-inspector-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
#gp-single-flow h2 { margin:0; font-size:16px; font-weight:500; }
#gp-single-flow h3 { font-size:15px; font-weight:500; margin:8px 0 12px; }
#gp-single-flow h4 { font-size:13px; font-weight:500; margin:18px 0 9px; }
#gp-single-flow .sg-muted,#gp-single-flow .sg-overline { color:var(--muted-foreground); font-size:12px; }
#gp-single-flow .sg-overline { margin-top:22px; }
#gp-single-flow .sg-role { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted-foreground); }
#gp-single-flow dl { margin:20px 0; font-size:13px; line-height:1.6; }
#gp-single-flow dt { margin-top:16px; color:var(--muted-foreground); font-size:12px; }
#gp-single-flow dd { margin:4px 0 0; overflow-wrap:anywhere; }
#gp-single-flow summary { cursor:pointer; font-size:12px; color:var(--muted-foreground); }
#gp-single-flow .sg-source code { display:block; margin:10px 0; font-size:11px; overflow-wrap:anywhere; color:var(--foreground); }
#gp-single-flow .sg-source pre { font-size:11px; white-space:pre-wrap; overflow-wrap:anywhere; background:var(--muted); padding:10px; line-height:1.5; }
#gp-single-flow .sg-focus { margin-top:14px; }
#gp-single-flow .sg-neighbor { display:flex; flex-direction:column; align-items:flex-start; gap:4px; width:100%; text-align:left; border:0; border-top:1px solid var(--border); padding:11px 0; background:transparent; color:var(--foreground); cursor:pointer; }
#gp-single-flow .sg-neighbor strong { font-size:13px; font-weight:400; }
#gp-single-flow .sg-neighbor span,#gp-single-flow .sg-neighbor small { font-size:11px; color:var(--muted-foreground); }
#gp-single-flow .sg-incoming { margin-top:16px; }
#gp-single-flow .sg-empty { color:var(--muted-foreground); font-size:13px; line-height:1.7; margin:20px 0; }
#gp-single-flow .sg-locate { border-top:1px solid var(--border); margin-top:24px; padding-top:18px; }
#gp-single-flow .sg-locate h3 { font-size:12px; color:var(--muted-foreground); }
#gp-single-flow .sg-locate&gt;div { display:flex; flex-wrap:wrap; gap:7px; }
#gp-single-flow .sg-legend { margin-top:24px; display:flex; flex-wrap:wrap; gap:12px; color:var(--muted-foreground); font-size:11px; }
#gp-single-flow .sg-legend span { display:inline-flex; align-items:center; gap:6px; }
#gp-single-flow .sg-note { color:var(--muted-foreground); font-size:11px; line-height:1.6; margin-top:16px; }

      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
