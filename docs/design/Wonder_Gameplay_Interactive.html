:root {
  color-scheme: light;
  --vellum: #edf0ee;
  --sheet: #f8f9f7;
  --card: #ffffff;
  --ink: #22282d;
  --ink-2: #3a4249;
  --pencil: #6a737a;
  --rule: #c7cecb;
  --hair: #dde2df;
  --lapis: #1f4e9c;
  --lapis-wash: #edf2fa;
  --ochre: #a86b00;
  --ochre-wash: #fbf5ea;
  --verdigris: #2c7a6c;
  --violet: #5b3e8e;
  --redline: #d7263d;
  --font-ui: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-tech: Bahnschrift, "DIN Alternate", "DIN 2014", "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", var(--font-ui);
  --font-code: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; }
body { background: var(--vellum); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }

.gp-shell { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

/* ---------- top bar: a drawing title strip ---------- */
.gp-bar {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 28px;
  padding: 10px 20px; background: var(--sheet);
  border-bottom: 1px solid var(--ink-2); box-shadow: 0 2px 0 -1px var(--sheet), 0 3px 0 -1px var(--rule);
}
.gp-brand { display: flex; align-items: baseline; gap: 12px; }
.gp-brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .08em; }
.gp-brand-sub { color: var(--pencil); font-size: 14px; letter-spacing: .04em; }
.gp-tools { display: flex; align-items: center; gap: 6px; }
.gp-bar-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 0; font-size: 12px; color: var(--pencil); line-height: 1.5; }
.gp-count { font-family: var(--font-tech); font-size: 13px; color: var(--ink-2); }

.gp-btn {
  appearance: none; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  height: 30px; padding: 0 12px; border-radius: 2px; cursor: pointer; font-size: 13px;
  transition: border-color .12s, background .12s;
}
.gp-btn:hover { border-color: var(--ink-2); }
.gp-btn:active { background: var(--vellum); }
.gp-sq { width: 30px; padding: 0; font-family: var(--font-tech); font-size: 16px; }
.gp-zoom { display: inline-flex; align-items: center; margin-left: 10px; }
.gp-zoom .gp-btn:first-child { border-radius: 2px 0 0 2px; }
.gp-zoom .gp-btn:last-child { border-radius: 0 2px 2px 0; }
.gp-zoom-out { display: inline-grid; place-items: center; min-width: 56px; height: 30px; border-block: 1px solid var(--rule); background: var(--card); font-family: var(--font-tech); font-size: 13px; font-variant-numeric: tabular-nums; }

.gp-work { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
.gp-canvas { position: relative; min-width: 0; min-height: 0; }

/* ---------- React Flow chrome ---------- */
.react-flow { --xy-background-color: var(--vellum); }
.react-flow__handle { opacity: 0; pointer-events: none; width: 1px; height: 1px; min-width: 0; min-height: 0; border: 0; }
.react-flow__minimap { border: 1px solid var(--ink-2); border-radius: 0; box-shadow: 3px 3px 0 var(--rule); margin: 16px; }
.react-flow__node-sheet { pointer-events: all; cursor: default; }
.react-flow__node:focus-visible { outline: none; }
.react-flow__node:focus-visible .gp-step { outline: 2px solid var(--lapis); outline-offset: 3px; }

/* ---------- sheets (sections) ---------- */
.gp-sheet {
  position: relative; width: 100%; height: 100%;
  background: var(--sheet);
  border: 1px solid var(--ink-2);
  outline: 1px solid var(--rule); outline-offset: 7px;
}
.gp-sheet-head {
  display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start;
  padding: 22px 26px 0; height: 132px;
  transform-origin: 0 0;
}
.gp-sheet-no {
  font-family: var(--font-tech); font-weight: 300; font-size: 74px; line-height: .82; letter-spacing: -.02em;
  color: var(--ink); padding-right: 18px; border-right: 1px solid var(--rule); height: 86px; display: flex; align-items: flex-start;
  font-variant-numeric: tabular-nums;
}
.gp-sheet-text { min-width: 0; }
.gp-sheet-title { font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: .04em; }
.gp-sheet-sub { display: flex; gap: 14px; margin-top: 6px; font-size: 13px; color: var(--pencil); }
.gp-sheet-stage { font-family: var(--font-tech); color: var(--ink-2); font-size: 14px; }
.gp-sheet-desc { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink-2); max-width: 46em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gp-tick { position: absolute; width: 14px; height: 14px; border-color: var(--ink-2); border-style: solid; border-width: 0; }
.gp-tick.tl { left: -8px; top: -8px; border-left-width: 2px; border-top-width: 2px; }
.gp-tick.tr { right: -8px; top: -8px; border-right-width: 2px; border-top-width: 2px; }
.gp-tick.bl { left: -8px; bottom: -8px; border-left-width: 2px; border-bottom-width: 2px; }
.gp-tick.br { right: -8px; bottom: -8px; border-right-width: 2px; border-bottom-width: 2px; }

/* At overview zoom the sheet title block grows so the whole set stays legible. */
[data-scale="overview"] .gp-sheet-head {
  position: absolute; left: -8px; bottom: calc(100% + 14px); height: auto; padding: 0;
  display: flex; align-items: baseline; gap: 8px; white-space: nowrap;
  transform: scale(var(--s, 1)); transform-origin: 0 100%;
}
[data-scale="overview"] .gp-sheet-no { font-size: 26px; font-weight: 400; height: auto; border: 0; padding: 0; line-height: 1; color: var(--pencil); }
[data-scale="overview"] .gp-sheet-title { line-height: 1; font-size: 26px; }
[data-scale="overview"] .gp-sheet-desc,
[data-scale="overview"] .gp-sheet-sub { display: none; }

/* ---------- steps ---------- */
.gp-step {
  --accent: var(--rule);
  position: relative; width: 208px; height: 60px; padding: 7px 11px 0 14px;
  background: var(--card); border: 1px solid #b9c1bd; border-radius: 3px;
  box-shadow: inset 4px 0 0 var(--accent);
  cursor: pointer; transition: opacity .15s, box-shadow .15s, border-color .15s;
}
.gp-step:hover { border-color: var(--ink-2); }
.gp-step-meta { display: flex; justify-content: space-between; align-items: center; height: 16px; font-size: 11px; color: var(--pencil); }
.gp-num { font-family: var(--font-tech); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.gp-step .gp-num { font-size: 12px; color: var(--pencil); }
.gp-kind { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-text, var(--pencil)); }
.gp-glyph { flex: none; }
.gp-step-title { margin-top: 3px; font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.k-player { --accent: var(--lapis); --accent-text: var(--lapis); }
.k-auto   { --accent: #c3cac6; --accent-text: var(--pencil); }
.k-gate   { --accent: var(--ochre); --accent-text: var(--ochre); }
.k-wait   { --accent: var(--verdigris); --accent-text: var(--verdigris); }
.k-state  { --accent: var(--violet); --accent-text: var(--violet); }

.gp-step.k-player { background: var(--lapis-wash); border-color: #9fb3d6; }
.gp-step.k-gate { background: var(--ochre-wash); border-color: #d8c08f; }
.gp-step.k-wait { border-style: dashed; border-color: var(--verdigris); }
.gp-step.k-state { border: 3px double var(--violet); padding-top: 5px; }

.gp-step.is-focused { border-color: var(--redline); box-shadow: inset 4px 0 0 var(--accent), 0 0 0 2px var(--redline), 0 6px 18px -8px rgba(34,40,45,.45); }
.gp-step.is-near { border-color: var(--ink-2); }
.gp-step.is-dim { opacity: .42; }

[data-scale="overview"] .gp-step-meta,
[data-scale="overview"] .gp-step-title { visibility: hidden; }
[data-scale="overview"] .gp-step { box-shadow: inset 208px 0 0 color-mix(in srgb, var(--accent) 34%, transparent); }
[data-scale="overview"] .gp-step.k-auto { box-shadow: inset 208px 0 0 #e3e7e4; }
[data-scale="overview"] .gp-step.is-focused { box-shadow: inset 208px 0 0 var(--redline), 0 0 0 4px var(--redline); }

/* ---------- edges ---------- */
.react-flow__edge-path.gp-edge { stroke: var(--ink-2); stroke-width: 1.25; fill: none; opacity: .78; transition: opacity .15s; }
.react-flow__edge-path.gp-edge.is-loop { stroke-dasharray: 5 4; }
.react-flow__edge-path.gp-edge.is-cross { stroke: #7d8a93; stroke-width: 1; opacity: .3; }
.react-flow__edge-path.gp-edge.is-lit { stroke: var(--redline); stroke-width: 2.2; opacity: 1; }
.react-flow__edge-path.gp-edge.is-dim { opacity: .14; }
[data-scale="overview"] .react-flow__edge-path.gp-edge { stroke-width: 2.4; }
[data-scale="overview"] .react-flow__edge-path.gp-edge.is-lit { stroke-width: 5; }

.gp-elabel {
  position: absolute; pointer-events: none; z-index: 2;
  padding: 0 5px; font-size: 11px; line-height: 18px; white-space: nowrap;
  color: var(--ink-2); background: var(--sheet); border-radius: 2px;
}
.gp-elabel.is-cross { background: var(--card); border: 1px solid var(--rule); }
.gp-elabel.is-lit { color: #fff; background: var(--redline); border-color: var(--redline); }
.gp-elabel.is-dim { opacity: .3; }
[data-scale="overview"] .gp-elabel { visibility: hidden; }

/* ---------- side panel: spec sheet ---------- */
.gp-panel {
  overflow-y: auto; background: var(--card); border-left: 1px solid var(--ink-2);
  padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 22px;
}
.gp-panel-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.gp-panel-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .06em; }
.gp-muted { color: var(--pencil); font-size: 12px; }

.gp-detail-path { display: flex; justify-content: space-between; color: var(--pencil); font-size: 12px; }
.gp-detail-path .gp-num { font-size: 15px; color: var(--ink-2); }
.gp-detail h3 { margin: 4px 0 8px; font-size: 20px; line-height: 1.35; font-weight: 700; }
.gp-role { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent-text); padding: 1px 8px 1px 6px; border: 1px solid currentColor; border-radius: 2px; }
.gp-detail dl { margin: 16px 0 0; display: grid; gap: 4px; }
.gp-detail dt { font-size: 12px; color: var(--pencil); margin-top: 8px; }
.gp-detail dd { margin: 0; font-size: 14px; line-height: 1.65; }
.gp-source { margin-top: 14px; border-top: 1px solid var(--hair); padding-top: 10px; }
.gp-source summary, .gp-in summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
.gp-source code { display: block; margin: 8px 0 6px; font-family: var(--font-code); font-size: 11.5px; color: var(--pencil); word-break: break-all; }
.gp-source pre { margin: 0; max-height: 280px; overflow: auto; padding: 10px 12px; background: #f3f5f4; border-left: 3px solid var(--rule); font-family: var(--font-code); font-size: 11.5px; line-height: 1.5; tab-size: 4; }
.gp-wide { margin-top: 14px; width: 100%; }

.gp-links { margin-top: 18px; }
.gp-links h4 { margin: 0 0 6px; font-size: 13px; font-weight: 700; }
.gp-link {
  display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: baseline;
  width: 100%; text-align: left; padding: 8px 2px; background: none; border: 0; border-top: 1px solid var(--hair); cursor: pointer;
}
.gp-link:hover strong { color: var(--redline); }
.gp-link-cond { grid-column: 1 / -1; font-size: 11.5px; color: var(--ochre); }
.gp-link strong { font-size: 14px; font-weight: 600; }
.gp-link small { color: var(--pencil); font-size: 11.5px; text-align: right; }
.gp-in summary { padding: 6px 0; }

.gp-empty p { margin: 0 0 8px; color: var(--ink-2); line-height: 1.7; }
.gp-empty .gp-btn { margin-top: 6px; }

.gp-index h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; }
.gp-index ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink-2); }
.gp-index li { border-bottom: 1px solid var(--hair); }
.gp-index li:nth-child(odd) { border-right: 1px solid var(--hair); }
.gp-index button { display: flex; gap: 10px; align-items: baseline; width: 100%; padding: 7px 8px; background: none; border: 0; cursor: pointer; text-align: left; font-size: 14px; }
.gp-index button:hover { background: var(--vellum); }
.gp-index .gp-num { color: var(--pencil); font-size: 13px; }

.gp-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--ink-2); }
.gp-legend span { display: inline-flex; align-items: center; gap: 6px; }
.gp-legend .k-player svg, .gp-legend .k-gate svg, .gp-legend .k-wait svg, .gp-legend .k-state svg, .gp-legend .k-auto svg { color: var(--accent-text); }
.gp-legend-line { flex-basis: 100%; }
.gp-note { margin: 0; font-size: 12px; color: var(--pencil); line-height: 1.7; }
.gp-error { padding: 24px; color: var(--redline); }

@media (max-width: 900px) {
  .gp-bar { grid-template-columns: 1fr; gap: 8px; }
  .gp-bar-meta { align-items: flex-start; }
  .gp-work { grid-template-columns: 1fr; grid-template-rows: 1fr 42vh; }
  .gp-panel { border-left: 0; border-top: 1px solid var(--ink-2); }
  .react-flow__minimap { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
