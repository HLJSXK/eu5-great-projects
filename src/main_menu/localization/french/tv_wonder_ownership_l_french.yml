 tv_wonder_ownership.800.t:0 "[tv_wonder_construction|E]：Merveille mondiale Sécurisé"
 tv_wonder_ownership.800.d:0 "La province nouvellement acquise de [SCOPE.sLocation('tv_wonder_ownership_site').GetName] contient un [tv_wonder_construction|E]. Ses effets de base répondent désormais à notre règle, et nos ingénieurs l'ont enregistré comme un possible site d'expansion si son échelle préservée permet de poursuivre les travaux.\n\n#weak La merveille nous appartient désormais: examiner ses effets au sein du département d'ingénierie et réfléchir à la possibilité de l'étendre davantage.#!"
 tv_wonder_ownership.800.a:0 "Mettez-la en œuvre."
 tv_wonder_ownership.900.t:0 "[tv_wonder_construction|E]：Une merveille mondiale Perdu"
 tv_wonder_ownership.900.d:0 "Avec [SCOPE.sLocation('tv_wonder_ownership_site').GetName] perdu, le terminé [tv_wonder_construction|E] il ne supporte plus notre royaume. Tout avantage permanent lié à une cérémonie nationale uniquement lié à cette merveille a été retiré de nos registres.\n\n#weak Avec la perte de la province, les avantages fixes de la merveille ont disparu. Si elle est récupérée plus tard, confirmez son statut auprès du département d'ingénierie.#!"
 tv_wonder_ownership.900.a:0 "Nous devons la reprendre !"
 tv_wonder_ownership.800.b:0 "Strip it bare."
 tv_wonder_ownership.900.d_preserved:0 "[SCOPE.sCountry('winner').GetName] has chosen to spare [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. The site is ours no longer, but the monument stands as it always has."
 tv_wonder_ownership.900.d_plundered:0 "[SCOPE.sCountry('winner').GetName] has plundered [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. Its treasures now fill their coffers, and the wonder has lost a level. If it was down to its last level, nothing of it remains."
 tv_wonder_ownership.900.d_stale:0 "[SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName] has passed out of our hands, yet no decision on its fate has taken effect. Either the site found no new master, or it changed hands again, or the wonder itself changed, before any such decision could be carried out."
