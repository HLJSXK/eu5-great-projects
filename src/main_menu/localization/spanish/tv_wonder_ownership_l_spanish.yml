 tv_wonder_ownership.800.t:0 "[tv_wonder_construction|E]: Maravilla mundial asegurada"
 tv_wonder_ownership.800.d:0 "La provincia recién adquirida de [SCOPE.sLocation('tv_wonder_ownership_site').GetName] contiene un [tv_wonder_construction|E] completo. Sus efectos básicos ahora responden a nuestra regla, y nuestros ingenieros lo han registrado como un posible sitio de expansión si su escala preservada permite seguir trabajando.\n\n#weak La maravilla ahora nos pertenece: revise sus efectos en el Departamento de Ingeniería y considere si se puede expandir aún más.#!"
 tv_wonder_ownership.800.a:0 "Ponlo a trabajar."
 tv_wonder_ownership.900.t:0 "[tv_wonder_construction|E]：Una maravilla del mundo perdida"
 tv_wonder_ownership.900.d:0 "Con [SCOPE.sLocation('tv_wonder_ownership_site').GetName] perdido, el [tv_wonder_construction|E] completo ya no es compatible con nuestro reino. Cualquier beneficio permanente de ceremonia nacional vinculado únicamente a esa maravilla ha sido retirado de nuestros libros de contabilidad.\n\n#weak Con la provincia perdida, los beneficios fijos de la maravilla desaparecen; si se recupera más tarde, confirme su estado en el Departamento de Ingeniería.#!"
 tv_wonder_ownership.900.a:0 "¡Debemos recuperarlo!"
 tv_wonder_ownership.800.b:0 "Strip it bare."
 tv_wonder_ownership.900.d_preserved:0 "[SCOPE.sCountry('winner').GetName] has chosen to spare [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. The site is ours no longer, but the monument stands as it always has."
 tv_wonder_ownership.900.d_plundered:0 "[SCOPE.sCountry('winner').GetName] has plundered [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. Its treasures now fill their coffers, and the wonder has lost a level. If it was down to its last level, nothing of it remains."
 tv_wonder_ownership.900.d_stale:0 "[SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName] has passed out of our hands, yet no decision on its fate has taken effect. Either the site found no new master, or it changed hands again, or the wonder itself changed, before any such decision could be carried out."
