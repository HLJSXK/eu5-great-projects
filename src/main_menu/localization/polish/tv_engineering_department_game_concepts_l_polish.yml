 # ── Engineering Department / Wonder Construction ──────────────────────────
 game_concept_tv_engineering_department: "Dział Inżynierii"
 game_concept_tv_engineering_department_desc: "Nieunikalna organizacja międzynarodowa tworzona automatycznie dla każdego kraju podczas inicjowania kampanii. Posiada biuro [tv_great_engineer|e] i zarządza każdym etapem [tv_wonder_construction|e]: [tv_wonder_concept|e], oddziałem [tv_wonder_survey|e], organizacją, logistyką i końcowym [tv_wonder_ceremony|e]."

 game_concept_tv_great_engineer: "Wielki Inżynier"
 game_concept_tv_great_engineer_desc: "Wyznaczona postać, która prowadzi [tv_engineering_department|e]. [tv_great_engineer|e] jest przechowywany jako zmienna kraju i można go wyznaczyć, zastąpić lub usunąć z panelu [tv_engineering_department|e]."

 game_concept_tv_wonder_concept: "Poczęcie"
 game_concept_tv_wonder_concept_desc: "Etap propozycji otwierający nowy [tv_wonder_construction|e]. Co miesiąc postęp umiejętności administracyjnych [tv_great_engineer|e] Postęp poczęcia; po jego ukończeniu [tv_great_engineer|e] przedstawia wykonalny projekt [tv_wonder_small|e], [tv_wonder_medium|e] lub [tv_wonder_large|e] do realizacji w kraju."

 game_concept_tv_wonder_survey: "Ankieta"
 game_concept_tv_wonder_survey_desc: "Etap oceny lokalizacji [tv_wonder_construction|e]. Postęp badania rośnie co miesiąc w zależności od umiejętności wojskowych [tv_great_engineer|e], ujawnia [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] i [tv_wonder_organization_competence|e] i pozwala krajowi potwierdzić miejsce budowy po zakończeniu odczytów."

 game_concept_tv_wonder_debate: "Debata"
 game_concept_tv_wonder_debate_desc: "Etap debaty krajowej [tv_wonder_construction|e]. Zaspokajanie wymagań dotyczących nieruchomości i debatowanie nad wydarzeniami buduje [tv_wonder_domestic_support|e]; gdy osiągnie 100, kraj może ogłosić zakończenie debaty i przejść do [tv_wonder_survey|e]."


 game_concept_tv_wonder_ceremony: "Ceremonia"
 game_concept_tv_wonder_ceremony_desc:0 "The dedication of a completed Great Project. Generic and unique wonders offer three styles or a plain inauguration. Dedication is recorded independently from the final building; its rewards and societal tendency end when the wonder is lost or its dedication fades."

 game_concept_tv_wonder_construction: "Świetny projekt"
 game_concept_tv_wonder_construction_desc: "Mechanizm Wielkiego Projektu zarządzany przez [tv_engineering_department|e]. [tv_great_engineer|e] kończy [tv_wonder_concept|e] i proponuje projekt [tv_wonder_small|e], [tv_wonder_medium|e] lub [tv_wonder_large|e]; po [tv_wonder_debate|e] wewnętrznej i [tv_wonder_survey|e] postępują cztery [tv_wonder_construction_part|e]y. Każdy $tv_wonder_labor_camp$ zużywa narzędzia, drewno i mur z lokalnego rynku."

 game_concept_tv_wonder_expansion: "Ekspansja"
 game_concept_tv_wonder_expansion_desc:0 "Raise an inaugurated wonder at the same site. A dedicated wonder retains its dedication and skips the ritual phase without repeating ritual rewards. A plain wonder may choose a dedication or remain plain after expansion. Preserved survey competence and base construction rewards follow the usual rules."

 game_concept_tv_wonder_construction_part: "Część konstrukcyjna"
 game_concept_tv_wonder_construction_part_desc: "Jedna z czterech równoległych ścieżek — podstawa, główna struktura, funkcja i zwieńczenie — którymi [tv_wonder_construction|e] postępuje jednocześnie. Poziom projektu zależy od tego, która z czterech części pozostaje w tyle, dlatego postęp musi być rozłożony równomiernie, a nie pędzony jedną ścieżką."

 game_concept_tv_wonder_small: "Mały projekt"
 game_concept_tv_wonder_small_desc: "Klasa wielkości [tv_wonder_construction|e]. Małe projekty mogą być budowane więcej niż raz. Ich wpływ na kraj bazowy ogranicza się do przepływu wartości, podczas gdy efekty lokalne i efekty ceremonii są nieograniczone.\nKażdy poziom małego projektu kosztuje zazwyczaj około #Y 10 000@gold!#!."

 game_concept_tv_wonder_medium: "Projekt średni"
 game_concept_tv_wonder_medium_desc: "Klasa wielkości [tv_wonder_construction|e] pomiędzy małymi i dużymi projektami. Kraj nie może rozpocząć drugiego średniego projektu tego samego typu, ale jego efekty dla kraju bazowego, efekty lokalne i efekty ceremonii są nieograniczone.\nKażdy poziom średniego projektu kosztuje zazwyczaj około #Y 20 000@gold!#!."

 game_concept_tv_wonder_large: "Duży projekt"
 game_concept_tv_wonder_large_desc: "Klasa wielkości [tv_wonder_construction|e]. Kraj nie może rozpocząć drugiego dużego projektu tego samego typu, ale jego efekty dla kraju bazowego, efekty lokalne i efekty ceremonii są nieograniczone.\nKażdy poziom dużego projektu kosztuje zazwyczaj około #Y 30 000@gold!#!."

 game_concept_tv_wonder_generic: "Ogólny cud"
 game_concept_tv_wonder_generic_desc: "[tv_wonder_construction|e] zaproponowany przez [tv_great_engineer|e] i swobodnie umiejscowiony w skali [tv_wonder_small|e], [tv_wonder_medium|e] lub [tv_wonder_large|e], w przeciwieństwie do [tv_wonder_unique|e] zamocowanego na mapie. Jego inauguracja pozwala wybrać styl [tv_wonder_ceremony|e]."

 game_concept_tv_wonder_unique: "Unikalny cud"
 game_concept_tv_wonder_unique_desc: "Historyczny [tv_wonder_construction|e] ustawiony w określonym miejscu na mapie, w przeciwieństwie do swobodnie rozmieszczonego [tv_wonder_generic|e]. Większość unikalnych cudów automatycznie przechodzi przez 8-etapowy [tv_wonder_ceremony|e] po zakończeniu budowy; zamiast tego kilka z nich ma własną dedykowaną ceremonię ręczną."

 game_concept_tv_wonder_domestic_support: "Wsparcie krajowe"
 game_concept_tv_wonder_domestic_support_desc: "Zasób [tv_wonder_construction|e] reprezentujący elitarną i publiczną chęć utrzymania dużego Wielkiego Projektu. Osiągnij 100, aby zakończyć początkową debatę; wsparcie może być przechowywane do 200 i zanika po zakończeniu debaty."

 game_concept_tv_wonder_scale_competence: "Kompetencja skali"
 game_concept_tv_wonder_scale_competence_desc: "Odczyt [tv_wonder_survey|e] określający, jak dobrze wybrana lokalizacja może pomieścić zamierzony rozmiar projektu, osie, fundamenty i podejście publiczne, bez narzucania projektu niezręcznego kształtu. Ustawia maksymalny poziom Wielkiego Projektu na 20%, 40%, 60%, 80% i 100%, przy czym poziom 6 wymaga 100%."

 game_concept_tv_wonder_organization_competence: "Kompetencje organizacyjne"
 game_concept_tv_wonder_organization_competence_desc: "Odczyt [tv_wonder_survey|e] pokazujący, jak czysto można dostosować harmonogramy pracy, brygadzistów, warsztaty i etapy budowy, aby realizować jeden plan zamiast wielu konkurencyjnych zamówień. Ustawia liniowo maksymalny poziom Miejsca Pracy Wielkiego Projektu od 0 do 20."

 game_concept_tv_wonder_logistics_competence: "Kompetencje logistyczne"
 game_concept_tv_wonder_logistics_competence_desc: "Ocena dróg, wozów, portów, mostów i punktów przekazania określająca, czy dobra docierają na miejsce na czas."

