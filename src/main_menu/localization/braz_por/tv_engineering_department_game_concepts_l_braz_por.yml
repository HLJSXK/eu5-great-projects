 # ── Engineering Department / Wonder Construction ──────────────────────────
 game_concept_tv_engineering_department: "Departamento de Engenharia"
 game_concept_tv_engineering_department_desc: "Uma organização internacional não única estabelecida automaticamente para cada país durante a inicialização da campanha. Ela ocupa o escritório [tv_great_engineer|e] e gerencia todas as etapas de um [tv_wonder_construction|e]: [tv_wonder_concept|e], site [tv_wonder_survey|e], organização, logística e [tv_wonder_ceremony|e] final."

 game_concept_tv_great_engineer: "Grande Engenheiro"
 game_concept_tv_great_engineer_desc: "O personagem indicado que lidera o [tv_engineering_department|e]. O [tv_great_engineer|e] é armazenado como uma variável de país e pode ser nomeado, substituído ou dispensado no painel [tv_engineering_department|e]."

 game_concept_tv_wonder_concept: "Concepção"
 game_concept_tv_wonder_concept_desc: "A etapa de proposta que abre um novo [tv_wonder_construction|e]. A cada mês, a habilidade administrativa do [tv_great_engineer|e] avança no progresso da Concepção; uma vez concluído, o [tv_great_engineer|e] apresenta um projeto [tv_wonder_small|e], [tv_wonder_medium|e] ou [tv_wonder_large|e] viável para o país seguir."

 game_concept_tv_wonder_survey: "Pesquisa"
 game_concept_tv_wonder_survey_desc: "O estágio de avaliação do local de [tv_wonder_construction|e]. O progresso da pesquisa aumenta mensalmente a partir da habilidade militar do [tv_great_engineer|e], revela [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] e [tv_wonder_organization_competence|e] e permite que o país confirme um canteiro de obras assim que as leituras forem concluídas."

 game_concept_tv_wonder_debate: "Debate"
 game_concept_tv_wonder_debate_desc: "A fase de debate doméstico de [tv_wonder_construction|e]. Satisfazer demandas imobiliárias e eventos de debate constrói [tv_wonder_domestic_support|e]; ao chegar a 100, o país pode declarar o debate encerrado e passar para [tv_wonder_survey|e]."


 game_concept_tv_wonder_ceremony: "Cerimônia"
 game_concept_tv_wonder_ceremony_desc:0 "The dedication of a completed Great Project. Generic and unique wonders offer three styles or a plain inauguration. Dedication is recorded independently from the final building; its rewards and societal tendency end when the wonder is lost or its dedication fades."

 game_concept_tv_wonder_construction: "Ótimo projeto"
 game_concept_tv_wonder_construction_desc: "Um mecanismo de Grande Projeto gerenciado através do [tv_engineering_department|e]. Uma vez que o [tv_great_engineer|e] do [tv_wonder_concept|e] produza um projeto [tv_wonder_small|e], [tv_wonder_medium|e] ou [tv_wonder_large|e] viável e o país resolva o debate interno, ele conclui um [tv_wonder_survey|e], organiza o trabalho, reúne [tv_wonder_materials|e] e avança quatro [tv_wonder_construction_part|e]s para elevar o projeto ao seu nível final."

 game_concept_tv_wonder_expansion: "Expansão"
 game_concept_tv_wonder_expansion_desc:0 "Raise an inaugurated wonder at the same site. A dedicated wonder retains its dedication and skips the ritual phase without repeating ritual rewards. A plain wonder may choose a dedication or remain plain after expansion. Preserved survey competence and base construction rewards follow the usual rules."

 game_concept_tv_wonder_construction_part: "Parte de construção"
 game_concept_tv_wonder_construction_part_desc: "Uma das quatro trilhas paralelas – Fundação, Estrutura Principal, Função e Coroamento – que um [tv_wonder_construction|e] avança ao mesmo tempo. O nível do projecto é definido pela parte que estiver mais atrasada, pelo que o progresso deve ser distribuído uniformemente em vez de ser apressado num único caminho."

 game_concept_tv_wonder_small: "Pequeno Projeto"
 game_concept_tv_wonder_small_desc: "Uma classe de tamanho [tv_wonder_construction|e]. Pequenos projetos podem ser construídos mais de uma vez. Seu efeito de país base é limitado ao movimento de valor, enquanto os efeitos locais e os efeitos de cerimônia são irrestritos.\nCada nível de um pequeno projeto normalmente custa cerca de #Y 10.000@gold!#!."

 game_concept_tv_wonder_medium: "Projeto Médio"
 game_concept_tv_wonder_medium_desc: "Uma classe de tamanho [tv_wonder_construction|e] entre projetos pequenos e grandes. Um país não pode iniciar um segundo projeto médio do mesmo tipo, mas seus efeitos de país de base, efeitos locais e efeitos de cerimônia são irrestritos.\nCada nível de um projeto médio normalmente custa cerca de #Y 20.000@gold!#!."

 game_concept_tv_wonder_large: "Grande Projeto"
 game_concept_tv_wonder_large_desc: "Uma classe de tamanho [tv_wonder_construction|e]. Um país não pode iniciar um segundo grande projeto do mesmo tipo, mas seus efeitos de país de base, efeitos locais e efeitos de cerimônia são irrestritos.\nCada nível de um grande projeto normalmente custa cerca de #Y 30.000@gold!#!."

 game_concept_tv_wonder_generic: "Maravilha Genérica"
 game_concept_tv_wonder_generic_desc: "Um [tv_wonder_construction|e] proposto pelo [tv_great_engineer|e] e localizado gratuitamente na escala [tv_wonder_small|e], [tv_wonder_medium|e] ou [tv_wonder_large|e], em oposição a um [tv_wonder_unique|e] fixado no mapa. Sua inauguração permite escolher um estilo [tv_wonder_ceremony|e]."

 game_concept_tv_wonder_unique: "Maravilha Única"
 game_concept_tv_wonder_unique_desc: "Um [tv_wonder_construction|e] histórico fixado em um local específico do mapa, em oposição a um [tv_wonder_generic|e] localizado gratuitamente. A maioria das maravilhas exclusivas avança automaticamente através de um [tv_wonder_ceremony|e] de 8 estágios assim que a construção for concluída; alguns têm sua própria cerimônia manual dedicada."

 game_concept_tv_wonder_domestic_support: "Apoio Doméstico"
 game_concept_tv_wonder_domestic_support_desc: "Um recurso [tv_wonder_construction|e] que representa a disposição da elite e do público para sustentar um grande grande projeto. Alcance 100 para encerrar o debate inicial; o apoio pode ser armazenado até 200 e decai após o término do debate."

 game_concept_tv_wonder_scale_competence: "Competência de escala"
 game_concept_tv_wonder_scale_competence_desc: "Uma leitura [tv_wonder_survey|e] de quão bem o local escolhido pode suportar o tamanho, eixos, fundações e abordagem pública pretendidos do projeto sem forçar o projeto a uma forma estranha. Ele define o nível máximo de Grande Projeto em 20%, 40%, 60%, 80% e 100%, com o nível 6 exigindo 100%."

 game_concept_tv_wonder_organization_competence: "Competência Organizacional"
 game_concept_tv_wonder_organization_competence_desc: "Uma leitura [tv_wonder_survey|e] sobre como as listas de mão de obra, capatazes, oficinas e etapas de construção podem ser feitas de maneira limpa para atender a um plano em vez de muitos pedidos concorrentes. Ele define linearmente o nível máximo do Local de Trabalho do Grande Projeto de 0 a 20."

 game_concept_tv_wonder_logistics_competence: "Competência Logística"
 game_concept_tv_wonder_logistics_competence_desc: "Uma leitura [tv_wonder_survey|e] para estradas, carrinhos, portos, pontes e pontos de transferência que determina se [tv_wonder_materials|e] chega ao local quando os pedreiros precisam deles."

 # ── Europedia Tab UI ─────────────────────────────────────────────────────────────────────────
 game_concept_tv_wonder_materials: "$tv_wonder_materials$"
 game_concept_tv_wonder_materials_desc: "Um bem produzido no mercado usado para manter $tv_wonder_labor_camp$ durante um [tv_wonder_construction|e] ativo. Cada $tv_wonder_material_dispatch_point$ converte bens básicos de construção em [tv_wonder_materials|e], de modo que o fornecimento e o preço são tratados no mercado normal."
 game_concept_tv_wonder_materials_europedia_desc: "Os Wonder Materials não são armazenados antecipadamente – cada $tv_wonder_material_dispatch_point$ os refina sob demanda a partir de produtos de construção comuns já circulando no mercado, e o edifício $tv_wonder_labor_camp$ que realmente funciona no local os consome à medida que é construído. Dado que ambos os extremos da cadeia se situam no mercado normal, um Grande Projecto compete com o resto da economia do país pelos mesmos bens de base, e uma escassez revela-se como uma construção mais lenta e não como uma paragem brusca."
 game_concept_tv_wonder_construction_europedia_desc: "Um Grande Projeto é o fio condutor de todo o país que leva uma maravilha da ideia ao monumento. Um [tv_great_engineer|e] primeiro completa [tv_wonder_concept|e] para propor um empreendimento [tv_wonder_small|e], [tv_wonder_medium|e] ou [tv_wonder_large|e] viável; o país então resolve o [tv_wonder_debate|e] doméstico; um [tv_wonder_survey|e] confirma que o local escolhido pode suportá-lo; e só então começa a construção propriamente dita, com quatro [tv_wonder_construction_part|e] subindo juntos em [tv_wonder_materials|e] e mão de obra organizada até que todo o projeto chegue ao seu nível final e seja encerrado com um [tv_wonder_ceremony|e]. Um projeto [tv_wonder_generic|e] concluído pode posteriormente ser levado adiante através do [tv_wonder_expansion|e] sem repetir nenhum dos estágios anteriores."
