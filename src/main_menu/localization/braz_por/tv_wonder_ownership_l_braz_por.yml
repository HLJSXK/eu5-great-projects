 tv_wonder_ownership.800.t:0 "[tv_wonder_construction|E]: Maravilha do Mundo Protegida"
 tv_wonder_ownership.800.d:0 "A província recém-adquirida de [SCOPE.sLocation('tv_wonder_ownership_site').GetName] contém um [tv_wonder_construction|E] concluído. Seus efeitos básicos agora respondem à nossa regra, e nossos engenheiros o registraram como um possível local de expansão se sua escala preservada permitir trabalhos adicionais.\n\n#weak A maravilha agora pertence a nós - revise seus efeitos no Departamento de Engenharia e considere se pode ser expandido ainda mais.#!"
 tv_wonder_ownership.800.a:0 "Coloque-o para funcionar."
 tv_wonder_ownership.900.t:0 "[tv_wonder_construction|E]：Uma maravilha mundial perdida"
 tv_wonder_ownership.900.d:0 "Com a perda de [SCOPE.sLocation('tv_wonder_ownership_site').GetName], o [tv_wonder_construction|E] concluído não suporta mais nosso reino. Qualquer benefício permanente da cerimônia nacional vinculado apenas a essa maravilha foi retirado de nossos livros.\n\n#weak Com a perda da província, os benefícios fixos da maravilha desaparecem - se ela for retomada posteriormente, confirme seu status no Departamento de Engenharia.#!"
 tv_wonder_ownership.900.a:0 "Temos de retomá-la!"
 tv_wonder_ownership.800.b:0 "Strip it bare."
 tv_wonder_ownership.900.d_preserved:0 "[SCOPE.sCountry('winner').GetName] has chosen to spare [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. The site is ours no longer, but the monument stands as it always has."
 tv_wonder_ownership.900.d_plundered:0 "[SCOPE.sCountry('winner').GetName] has plundered [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. Its treasures now fill their coffers, and the wonder has lost a level. If it was down to its last level, nothing of it remains."
 tv_wonder_ownership.900.d_stale:0 "[SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName] has passed out of our hands, yet no decision on its fate has taken effect. Either the site found no new master, or it changed hands again, or the wonder itself changed, before any such decision could be carried out."
