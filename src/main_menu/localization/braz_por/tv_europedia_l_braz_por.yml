 TV_EU_CEREMONY_LEAD:0 "A finished wonder is a shell until it is dedicated. Three ritual styles are offered; each one gives the wonder a different permanent character and a different set of rewards, and each one costs gold and takes two years."
 TV_EU_CEREMONY_S1_P1_TEXT:0 "Built, standing, doing almost nothing. It carries only its cultural tradition until it is dedicated."
 TV_EU_CEREMONY_S1_P1_TITLE:0 "The Shell"
 TV_EU_CEREMONY_S1_P2_TEXT:0 "Preview all three for free. Each shows its real completion effect on the game's own terms, not a summary."
 TV_EU_CEREMONY_S1_P2_TITLE:0 "Pick a Style"
 TV_EU_CEREMONY_S1_P3_TEXT:0 "Confirming charges a size-scaled sum and settles every existing estate's satisfaction at once, for or against."
 TV_EU_CEREMONY_S1_P3_TITLE:0 "Pay and Settle"
 TV_EU_CEREMONY_S1_P4_TEXT:0 "The ritual runs 24 months. Support does not decay during it, and the style can no longer be changed."
 TV_EU_CEREMONY_S1_P4_TITLE:0 "Two Years"
 TV_EU_CEREMONY_S1_TITLE:0 "How a Dedication Happens"
 TV_EU_CEREMONY_S2_E1_TEXT:0 "#high 2#, #high 3#! or #high 5#! size-scaled sums of gold for a small, medium or large wonder. Confirming is the moment it is charged."
 TV_EU_CEREMONY_S2_E1_TITLE:0 "A Price by Size"
 TV_EU_CEREMONY_S2_E2_TEXT:0 "Every estate that favours your style gains #high 0.10#! satisfaction; every estate against it loses #high 0.05#!. Since the three styles disagree, some estate always pays."
 TV_EU_CEREMONY_S2_E2_TITLE:0 "Estate Satisfaction, Settled Once"
 TV_EU_CEREMONY_S2_E3_TEXT:0 "After completion, the dedication adds #high 0.1#! monthly pull towards the chosen societal direction."
 TV_EU_CEREMONY_S2_E3_TITLE:0 "A Monthly Societal Pull"
 TV_EU_CEREMONY_S2_E4_TEXT:0 "A dedication lasts 100 years, or until the location is lost or the building is demolished. A wonder that outlives its dedication falls back to plain."
 TV_EU_CEREMONY_S2_E4_TITLE:0 "A Memory of a Century"
 TV_EU_CEREMONY_S2_TITLE:0 "What the Styles Have in Common"
 TV_EU_CEREMONY_S3_A1_TEXT:0 "Immediate, free, and it still pays the completion rewards. Every participating estate resents it, and the wonder carries no ritual character at all."
 TV_EU_CEREMONY_S3_A1_TITLE:0 "Plain Inauguration"
 TV_EU_CEREMONY_S3_A2_TEXT:0 "Two years and a price, and in return the wonder keeps a style, its rewards, its societal pull and the estates that backed it."
 TV_EU_CEREMONY_S3_A2_TITLE:0 "Dedicated"
 TV_EU_CEREMONY_S3_SIGN:0 "or"
 TV_EU_CEREMONY_S3_TITLE:0 "Plain, or Dedicated"
 TV_EU_CEREMONY_S4_BODY:0 "Every expansion offers a fresh choice of all three ritual styles or a plain inauguration. The old dedication lasts until completion, when the new choice replaces it. A ritual follows the normal cost, duration, estate settlement and rewards."
 TV_EU_CEREMONY_S4_TITLE:0 "Expanding a Dedicated Wonder"
 TV_EU_CEREMONY_TITLE:0 "Dedication"
 TV_EU_COMPETENCES_LEAD:0 "Three readings come out of a survey. Scale caps the wonder's level, organization caps the size of the workforce you can put on it, and logistics sets how fast the work actually moves."
 TV_EU_COMPETENCES_S1_BODY:0 "Each band unlocks one more level. #high Level VI#! needs a full 100, which is why a poor site can never be pushed to the top no matter how much gold you spend on it. The Construction Flow Tuning setting can lift the ceiling entirely, for players who would rather build than negotiate with geography."
 TV_EU_COMPETENCES_S1_K1:0 "20\nLevel I"
 TV_EU_COMPETENCES_S1_K2:0 "40\nLevel II"
 TV_EU_COMPETENCES_S1_K3:0 "60\nLevel III"
 TV_EU_COMPETENCES_S1_K4:0 "80\nLevel IV"
 TV_EU_COMPETENCES_S1_K5:0 "100\nLevel V"
 TV_EU_COMPETENCES_S1_K6:0 "+ Settings\nLevel VI"
 TV_EU_COMPETENCES_S1_TITLE:0 "Scale: the Level Ceiling"
 TV_EU_COMPETENCES_S2_A1_TEXT:0 "Divided by five, this is the maximum level of the labor camp you may raise on the site, capped at #high 20#!. The camp is the workforce: no camp, no progress."
 TV_EU_COMPETENCES_S2_A1_TITLE:0 "Organization"
 TV_EU_COMPETENCES_S2_A2_TEXT:0 "Added to fifty, this is the percentage multiplier on progress: a reading of 0 still moves at half speed, a reading of 100 at #high 150%#!."
 TV_EU_COMPETENCES_S2_A2_TITLE:0 "Logistics"
 TV_EU_COMPETENCES_S2_SIGN:0 "or"
 TV_EU_COMPETENCES_S2_TITLE:0 "Organization and Logistics"
 TV_EU_COMPETENCES_S3_BODY:0 "Competence is a mix of the site's own suitability and the engineer's Administrative skill, and the site half is usually the larger half. Two locations in the same country can differ by tens of points because one is a capital city on a river and the other is a hill village.\n\n$BULLET$ A capital, a city, a port, a river and a road all raise the reading.\n$BULLET$ Mountains, wetlands, jungle and harsh climate lower it.\n$BULLET$ Development and existing buildings raise it, which is why a rich, busy location is the best place for a wonder and the worst place to find free ground."
 TV_EU_COMPETENCES_S3_TITLE:0 "Why the Ground Matters More Than the Engine"
 TV_EU_COMPETENCES_TITLE:0 "Survey Competences"
 TV_EU_CONCEPTION_LEAD:0 "The engineer decides what the country is capable of building, and puts three proposals in front of you. You may accept one, reject them for a small price, or buy a new set."
 TV_EU_CONCEPTION_S1_P1_TEXT:0 "Conception progress rises every month from Administrative skill until it reaches 100."
 TV_EU_CONCEPTION_S1_P1_TITLE:0 "The Meter Fills"
 TV_EU_CONCEPTION_S1_P2_TEXT:0 "The engineer offers up to three undertakings the country can actually support, at a size it can actually carry."
 TV_EU_CONCEPTION_S1_P2_TITLE:0 "Three Proposals"
 TV_EU_CONCEPTION_S1_P3_TEXT:0 "Small, medium or large. Size sets the ritual price, the per-unit construction demand and the ceiling on how often it can be repeated."
 TV_EU_CONCEPTION_S1_P3_TITLE:0 "Choose a Size"
 TV_EU_CONCEPTION_S1_P4_TEXT:0 "Accepting locks the wonder and opens the domestic debate. Nothing is spent yet."
 TV_EU_CONCEPTION_S1_P4_TITLE:0 "Accept"
 TV_EU_CONCEPTION_S1_TITLE:0 "How a Proposal Becomes a Project"
 TV_EU_CONCEPTION_S2_E1_TEXT:0 "Take the proposal as it stands and move to the [tv_wonder_debate|e]. Free."
 TV_EU_CONCEPTION_S2_E1_TITLE:0 "Accept"
 TV_EU_CONCEPTION_S2_E2_TEXT:0 "Pay a little #high prestige#! and go back to conceiving. Use it when the three proposals are all wrong for your country's geography."
 TV_EU_CONCEPTION_S2_E2_TITLE:0 "Reject"
 TV_EU_CONCEPTION_S2_E3_TEXT:0 "Pay one size-scaled sum of #high gold#! and draw a fresh set immediately. The expensive way to keep looking."
 TV_EU_CONCEPTION_S2_E3_TITLE:0 "Bribe"
 TV_EU_CONCEPTION_S2_TITLE:0 "Your Three Answers"
 TV_EU_CONCEPTION_TITLE:0 "Conception"
 TV_EU_CONSTRUCTION_LEAD:0 "Four parts rise at once from one labor camp. The wonder's level is the level of its slowest part, so feeding one part and starving the others is the most common way to waste a decade."
 TV_EU_CONSTRUCTION_S1_P1_TEXT:0 "Clearing, levelling, drainage and the first courses of stone."
 TV_EU_CONSTRUCTION_S1_P1_TITLE:0 "Foundation"
 TV_EU_CONSTRUCTION_S1_P2_TEXT:0 "The mass of the building: walls, piers, vaults, the thing that is seen from a distance."
 TV_EU_CONSTRUCTION_S1_P2_TITLE:0 "Main Structure"
 TV_EU_CONSTRUCTION_S1_P3_TEXT:0 "What the wonder actually does: docks, granaries, halls, water, watch."
 TV_EU_CONSTRUCTION_S1_P3_TITLE:0 "Function"
 TV_EU_CONSTRUCTION_S1_P4_TEXT:0 "Domes, spires, gilding and inscription: the part that makes it a wonder and not a large building."
 TV_EU_CONSTRUCTION_S1_P4_TITLE:0 "Crowning"
 TV_EU_CONSTRUCTION_S1_TITLE:0 "The Four Parts"
 TV_EU_CONSTRUCTION_S2_BODY:0 "Progress each month comes from four things at once, and any one of them can be the bottleneck:\n\n$BULLET$ #T The labor camp:#! each effective level adds a fixed amount of monthly progress. Its level cap comes from Organization, and it consumes #high tools and wonder materials#! every month.\n$BULLET$ #T Employment:#! a camp with unfilled jobs produces nothing. You need laborers in that location, not just the building.\n$BULLET$ #T Inputs:#! the camp buys its materials on the local market. A poor market means an empty-handed camp. Material workshops turn ordinary construction goods into wonder materials through eight methods, each yielding 1.00 materials. Earth, timber and kiln methods need no purchased tools; stone finishing and standardized components reward developed industries. Choose by market prices and supply, or import materials.\n$BULLET$ #T Logistics:#! the survey reading, applied as a 50% to 150% multiplier on whatever the above produces."
 TV_EU_CONSTRUCTION_S2_TITLE:0 "What Actually Moves the Work"
 TV_EU_CONSTRUCTION_S3_A1_TEXT:0 "Slow and sure. Every part reaches the new level together, the wonder climbs one level at a time, and nothing is wasted holding a part above the rest."
 TV_EU_CONSTRUCTION_S3_A1_TITLE:0 "Four Even Parts"
 TV_EU_CONSTRUCTION_S3_A2_TEXT:0 "Impressive in the panel, useless in the wonder. The other three parts hold the level exactly where it was until they catch up."
 TV_EU_CONSTRUCTION_S3_A2_TITLE:0 "One Showpiece Part"
 TV_EU_CONSTRUCTION_S3_SIGN:0 "or"
 TV_EU_CONSTRUCTION_S3_TITLE:0 "Balanced or Rushed"
 TV_EU_CONSTRUCTION_S4_E1_TEXT:0 "You must reach at least one level above where you started this round, then declare the wonder built. Declaring early is allowed and sometimes wise: a level 3 wonder you can dedicate now beats a level 6 one you cannot afford to keep."
 TV_EU_CONSTRUCTION_S4_E1_TITLE:0 "Declaring It Built"
 TV_EU_CONSTRUCTION_S4_E2_TEXT:0 "A wonder whose parts were built but which was never dedicated exists as a shell. Building the main structure to level 1 is enough to declare it, which lets a later ruler finish what an earlier one started."
 TV_EU_CONSTRUCTION_S4_E2_TITLE:0 "Continuing a Shell"
 TV_EU_CONSTRUCTION_S4_E3_TEXT:0 "If the location changes hands, the project aborts at once and its failure cost is paid. The worked stone stays where it is, and a conqueror who takes the site can continue it."
 TV_EU_CONSTRUCTION_S4_E3_TITLE:0 "Losing the Site"
 TV_EU_CONSTRUCTION_S4_TITLE:0 "Finishing, or Stopping Short"
 TV_EU_CONSTRUCTION_TITLE:0 "Construction"
 TV_EU_DEBATE_LEAD:0 "Before a single stone is cut, the nobility, the burghers and the clergy each want something. Satisfy enough of them and Domestic Support reaches 100 and the debate closes."
 TV_EU_DEBATE_S1_BODY:0 "[tv_wonder_domestic_support|e] is the country's willingness to keep paying for somebody else's monument. It runs from #high 0 to 200#! and it is the only figure that can end your project outright.\n\nOnce the debate closes, support stops being a goal and becomes a clock. It decays every month for the whole of survey and construction, and reclaiming it is far harder than earning it was."
 TV_EU_DEBATE_S1_TITLE:0 "What Support Is"
 TV_EU_DEBATE_S2_BODY:0 "Support is spent as well as earned: every accepted demand adds a flat #high 20#!, and a debate event can swing it either way by the same amount. At 200 the debate closes whether or not you are ready, so the only reason to hold a full meter is to carry the surplus into the decay that follows."
 TV_EU_DEBATE_S2_K1:0 "0\nDebate ends in failure"
 TV_EU_DEBATE_S2_K2:0 "100\nDebate may close"
 TV_EU_DEBATE_S2_K3:0 "200\nCloses by itself"
 TV_EU_DEBATE_S2_TITLE:0 "The Shape of the Debate"
 TV_EU_DEBATE_S3_E1_TEXT:0 "A country without burghers simply has one fewer demand to satisfy. The debate never asks for what the realm does not have."
 TV_EU_DEBATE_S3_E1_TITLE:0 "Only Living Estates Play"
 TV_EU_DEBATE_S3_E2_TEXT:0 "Every demand can be bribed away for one size-scaled sum of gold, at the cost of drawing a new demand from the same estate. Gold is the only resource that can make this stage harmless."
 TV_EU_DEBATE_S3_E2_TITLE:0 "Paying Your Way Out"
 TV_EU_DEBATE_S3_E3_TEXT:0 "The first time support hits zero after the debate, the court offers one reprieve: bribe the estates or make a public statement. The second time, the project ends."
 TV_EU_DEBATE_S3_E3_TITLE:0 "When It Runs Out"
 TV_EU_DEBATE_S3_TITLE:0 "Reading the Room"
 TV_EU_DEBATE_TITLE:0 "The Domestic Debate"
 TV_EU_DEMANDS_LEAD:0 "Every demand is a real concession out of your own treasury or your own privileges. There are only a handful of kinds, and each one maps to a tooltip you can read before you accept it."
 TV_EU_DEMANDS_S1_E1_TEXT:0 "One of that estate's unpicked privileges is granted, permanently and for free. The cheapest-looking demand and often the most lasting cost."
 TV_EU_DEMANDS_S1_E1_TITLE:0 "A Privilege"
 TV_EU_DEMANDS_S1_E2_TEXT:0 "Five years of lower taxation or lower conscription for that estate. It expires, which makes it the easiest demand to accept."
 TV_EU_DEMANDS_S1_E2_TITLE:0 "Lighter Burdens"
 TV_EU_DEMANDS_S1_E3_TEXT:0 "A policy that estate favours is enacted, with its usual stability price. You may not always be able to pay it."
 TV_EU_DEMANDS_S1_E3_TITLE:0 "A Policy Change"
 TV_EU_DEMANDS_S1_E4_TEXT:0 "Lost prestige, lost stability, lost legitimacy, a rival estate offended, mild inflation. Straightforward to read, straightforward to pay."
 TV_EU_DEMANDS_S1_E4_TITLE:0 "Punishment"
 TV_EU_DEMANDS_S1_E5_TEXT:0 "A cabinet member dismissed, an artist killed, a work of art destroyed. The demands that hurt beyond the ledger."
 TV_EU_DEMANDS_S1_E5_TITLE:0 "A Sacrifice"
 TV_EU_DEMANDS_S1_TITLE:0 "The Kinds of Demand"
 TV_EU_DEMANDS_S2_BODY:0 "Accepting is usually the right answer, because #high 20 support#! is worth more than most single costs, and because gold can buy you past anything you refuse.\n\nThe one demand to think twice about is a privilege: it is the only one that never comes back to you. If the estates are already powerful, refusing it for prestige or gold is usually the better trade."
 TV_EU_DEMANDS_S2_TITLE:0 "What Choice You Actually Have"
 TV_EU_DEMANDS_TITLE:0 "Estate Demands"
 TV_EU_DEPARTMENT_LEAD:0 "A standing office, one officer, one project at a time. It costs nothing to keep open and it is the only place a wonder can begin."
 TV_EU_DEPARTMENT_S1_BODY:0 "Every country holds a seat in the Engineering Department from the first day of the campaign, whether or not it ever builds anything. The department does not build: it holds the project. It remembers which wonder is underway, how far each part has risen, what the surveyors measured, whether support has collapsed, and who is entitled to be remembered at the dedication.\n\nBecause the project lives in the department and not in the buildings, a wonder survives losing its engineer, losing its site, or being paused for decades. Only abandoning the project or failing it outright ends the round."
 TV_EU_DEPARTMENT_S1_TITLE:0 "What the Office Is"
 TV_EU_DEPARTMENT_S2_E1_TEXT:0 "Which wonder, at which size, at which site, in which stage. One at a time: a second project waits until the first is finished, abandoned or failed."
 TV_EU_DEPARTMENT_S2_E1_TITLE:0 "The Current Wonder"
 TV_EU_DEPARTMENT_S2_E2_TEXT:0 "Conception and survey progress, the four construction part counts, and the three survey readings that cap everything downstream."
 TV_EU_DEPARTMENT_S2_E2_TITLE:0 "Progress and Competence"
 TV_EU_DEPARTMENT_S2_E3_TEXT:0 "Current Domestic Support, whether this round's one reprieve has been spent, and which estate asked for what during the debate."
 TV_EU_DEPARTMENT_S2_E3_TITLE:0 "Support and Estate Mood"
 TV_EU_DEPARTMENT_S2_TITLE:0 "What It Tracks"
 TV_EU_DEPARTMENT_TITLE:0 "The Engineering Department"
 TV_EU_ENGINEER_LEAD:0 "One character does the thinking and the walking. Their Administrative skill decides how fast a project is conceived, their Military skill how fast it is surveyed, and their name is on the monument afterwards."
 TV_EU_ENGINEER_S1_E1_TEXT:0 "Conception progress rises #high 1/5#! of the engineer's Administrative skill each month. A skill of 10 is two points a month; the meter runs to 100."
 TV_EU_ENGINEER_S1_E1_TITLE:0 "Administrative Skill, in Conception"
 TV_EU_ENGINEER_S1_E2_TEXT:0 "Survey progress rises #high 1/10#! of Military skill each month, and the survey is what confirms the ground. A strong engineer on a good site is the whole difference between a level 3 monument and a level 6 one."
 TV_EU_ENGINEER_S1_E2_TITLE:0 "Military Skill, in Survey"
 TV_EU_ENGINEER_S1_E3_TEXT:0 "The office is a role on the character, not a permanent appointment. Dismiss them and their replacement picks the project up where it stands, but a vacant seat freezes conception and survey until someone is appointed, while construction and ritual continue."
 TV_EU_ENGINEER_S1_E3_TITLE:0 "Tenure"
 TV_EU_ENGINEER_S1_TITLE:0 "What Each Skill Does"
 TV_EU_ENGINEER_S2_BODY:0 "Look at the two skills the project actually consumes: Administrative for what comes next, Military for the site. An old, highly skilled engineer is often better than a young brilliant one, because a project takes years and a dead engineer stops both of the meters that matter.\n\nThere is no experience, no training and no promotion attached to the post. The engineer is a filter on your project's speed, nothing more."
 TV_EU_ENGINEER_S2_TITLE:0 "Choosing One"
 TV_EU_ENGINEER_TITLE:0 "The Great Engineer"
 TV_EU_EXPANSION_LEAD:0 "A finished wonder is not the end of it. It can be raised higher, and a plain one can be given a dedication it never had."
 TV_EU_EXPANSION_S1_E1_TEXT:0 "A new construction round on the same site, with its own survey readings and its own rewards. Every wonder freely chooses its ritual again at the end."
 TV_EU_EXPANSION_S1_E1_TITLE:0 "Expansion"
 TV_EU_EXPANSION_S1_E2_TEXT:0 "A decision available while a project is being conceived. It takes a plain wonder straight to the ritual, skipping debate, survey and construction."
 TV_EU_EXPANSION_S1_E2_TITLE:0 "Rededication"
 TV_EU_EXPANSION_S1_TITLE:0 "Two Ways Back In"
 TV_EU_EXPANSION_S2_A1_TEXT:0 "Full completion rewards every time, and the wonder rises a level. Holding a ritual grants its rewards again and replaces the site's previous style; a plain inauguration removes the old dedication."
 TV_EU_EXPANSION_S2_A1_TITLE:0 "Expansion"
 TV_EU_EXPANSION_S2_A2_TEXT:0 "Only the chosen ritual's rewards. Choosing plain grants no additional rewards."
 TV_EU_EXPANSION_S2_A2_TITLE:0 "Rededication"
 TV_EU_EXPANSION_S2_SIGN:0 "or"
 TV_EU_EXPANSION_S2_TITLE:0 "What Each One Pays"
 TV_EU_EXPANSION_TITLE:0 "Expansion and Rededication"
 TV_EU_FILTER_ALL:0 "All"
 TV_EU_FILTER_ALL_TOOLTIP:0 "Open the all tab."
 TV_EU_FILTER_GENERIC:0 "Generic Projects"
 TV_EU_FILTER_GENERIC_TOOLTIP:0 "Open the generic projects tab."
 TV_EU_FILTER_MECHANICS:0 "Complete Mechanics"
 TV_EU_FILTER_MECHANICS_TOOLTIP:0 "Open the complete mechanics tab."
 TV_EU_FILTER_OVERVIEW:0 "Getting Started"
 TV_EU_FILTER_OVERVIEW_TOOLTIP:0 "Open the getting started tab."
 TV_EU_FILTER_UNIQUE:0 "Unique Projects"
 TV_EU_FILTER_UNIQUE_TOOLTIP:0 "Open the unique projects tab."
 TV_EU_KINDS_LEAD:0 "Every wonder in this catalogue is one of two things: an archetype you may site wherever the ground allows, or a monument that belongs to one place in the world."
 TV_EU_KINDS_S1_A1_TEXT:0 "You choose the site, so you can put it where the survey reads highest. Small ones repeat, which makes them the reliable way to farm a particular reward. The wonder is whatever your country makes of it."
 TV_EU_KINDS_S1_A1_TITLE:0 "Generic"
 TV_EU_KINDS_S1_A2_TEXT:0 "One place, one owner, one monument. You cannot choose the ground, and someone else may hold it before you. In exchange, the base effect is multiplied and the reward is worth the wait."
 TV_EU_KINDS_S1_A2_TITLE:0 "Unique"
 TV_EU_KINDS_S1_SIGN:0 "or"
 TV_EU_KINDS_S1_TITLE:0 "The Trade"
 TV_EU_KINDS_S2_BODY:0 "The world begins with many of these monuments already standing, owned by whoever holds their location, in the plain state. They give their base effects and nothing else until someone dedicates them, which makes a campaign's first prize the wonder a neighbour is sitting on.\n\nTaking one has its own consequence: the new owner is asked whether to spare it as its custodian for prestige, or to strip it for gold at the cost of one level."
 TV_EU_KINDS_S2_TITLE:0 "Historic Wonders at the Start"
 TV_EU_KINDS_TITLE:0 "Generic and Unique Wonders"
 TV_EU_OVERVIEW_LEAD:0 "A Great Project raises a wonder: one country, one monument, one engineer who has to talk three estates into paying for it and one surveyor who has to admit the ground is only so good. Nothing here is built by decree. It is conceived, argued over, measured, built in four parts at once, and finally dedicated, and every one of those steps can stall."
 TV_EU_OVERVIEW_S1_P1_TEXT:0 "The engineer works out what can be built. Their Administrative skill sets the pace."
 TV_EU_OVERVIEW_S1_P1_TITLE:0 "Conception"
 TV_EU_OVERVIEW_S1_P2_TEXT:0 "The estates name their price. Domestic Support has to reach 100 before anything is measured."
 TV_EU_OVERVIEW_S1_P2_TITLE:0 "Debate"
 TV_EU_OVERVIEW_S1_P3_TEXT:0 "The chosen ground is read for scale, organization and logistics: the ceiling on everything that follows."
 TV_EU_OVERVIEW_S1_P3_TITLE:0 "Survey"
 TV_EU_OVERVIEW_S1_P4_TEXT:0 "Four parts rise together in a labor camp. The slowest one holds the level back."
 TV_EU_OVERVIEW_S1_P4_TITLE:0 "Construction"
 TV_EU_OVERVIEW_S1_P5_TEXT:0 "The wonder is dedicated, or merely opened. This is what the monument does for the rest of the game."
 TV_EU_OVERVIEW_S1_P5_TITLE:0 "Dedication"
 TV_EU_OVERVIEW_S1_TITLE:0 "The Whole Project at a Glance"
 TV_EU_OVERVIEW_S2_BODY:0 "#T Start here:#! appoint a [tv_great_engineer|e] in the [tv_engineering_department|e] panel. Without one, nothing below ever starts moving. Then read the Conception card; the rest of these pages can wait until you reach them.\n\n$BULLET$ Everything a project spends is a real good or a real coin out of a real market. Nothing is granted.\n$BULLET$ Every stage can be watched in the department panel, and every number that follows has a tooltip there.\n$BULLET$ A project that stalls stays stalled: an abandoned or failed project leaves its worked stones behind as a candidate to be finished later."
 TV_EU_OVERVIEW_S2_TITLE:0 "Where to Begin"
 TV_EU_OVERVIEW_S3_BODY:0 "#T A [tv_wonder_generic|e]#! belongs to no place. Your engineer proposes it and you choose where it goes, so long as the ground allows it. Small ones can be raised again somewhere else, which makes them a renewable source of the same reward.\n#T A [tv_wonder_unique|e]#! belongs to one place in the world. Only whoever holds that place can build it, and it will exist once. In exchange for being hard to get, it is usually worth more."
 TV_EU_OVERVIEW_S3_TITLE:0 "Two Kinds of Wonder"
 TV_EU_OVERVIEW_TITLE:0 "Great Projects"
 TV_EU_SETTINGS_LEAD:0 "The mod ships with a full tuning menu for players who want the monument without the negotiation. Everything on it is optional and none of it is enabled by default."
 TV_EU_SETTINGS_S1_E1_TEXT:0 "Conception, debate and survey can each be completed automatically, and construction can be raised straight to level 6. Useful for measuring effects, ruinous for the game's tension."
 TV_EU_SETTINGS_S1_E1_TITLE:0 "Skip the Stages"
 TV_EU_SETTINGS_S1_E2_TEXT:0 "Unlimited scale lets any site reach level 6; unlimited organization lets any camp reach 20. Together they remove geography as a constraint."
 TV_EU_SETTINGS_S1_E2_TITLE:0 "Lift the Ceilings"
 TV_EU_SETTINGS_S1_E3_TEXT:0 "Direct construction prices, per-unit progress requirements, and the random construction and survey events can all be adjusted or turned off."
 TV_EU_SETTINGS_S1_E3_TITLE:0 "Price and Pace"
 TV_EU_SETTINGS_S1_E4_TEXT:0 "A style can be chosen and confirmed instantly and for free, for generic and unique wonders alike."
 TV_EU_SETTINGS_S1_E4_TITLE:0 "Skip the Ritual"
 TV_EU_SETTINGS_S1_TITLE:0 "What You Can Change"
 TV_EU_SETTINGS_TITLE:0 "Settings and Tuning"
 TV_EU_SIZES_LEAD:0 "Three sizes, with three different prices, three different rhythms and one important difference in what you are allowed to do with them afterwards."
 TV_EU_SIZES_S1_A1_TEXT:0 "Cheapest per unit and the only size that may be raised more than once. Its national effect is limited to moving a value, which keeps it from being an infinite economy on its own."
 TV_EU_SIZES_S1_A1_TITLE:0 "Small"
 TV_EU_SIZES_S1_A2_TEXT:0 "One of each kind per country, no exceptions, with unrestricted national and local effects. The budget of a generation for one monument."
 TV_EU_SIZES_S1_A2_TITLE:0 "Medium and Large"
 TV_EU_SIZES_S1_SIGN:0 "or"
 TV_EU_SIZES_S1_TITLE:0 "How They Compare"
 TV_EU_SIZES_S2_BODY:0 "$BULLET$ #T Ritual price:#! 2, 3 and 5 scaled gold.\n$BULLET$ #T Per-unit cost:#! roughly ten, twenty and thirty thousand gold per level in the game's own reference prices.\n$BULLET$ #T Progress demand:#! each construction unit asks more of the camp.\n$BULLET$ #T Repetition:#! small can be rebuilt elsewhere, medium and large cannot be duplicated at all."
 TV_EU_SIZES_S2_TITLE:0 "What Size Changes"
 TV_EU_SIZES_S3_BODY:0 "The engineer proposes what the country can support, so the choice is usually between a size you can finish and a size you can only start. A large wonder abandoned at level 2 is worse than a small one dedicated at level 4: the shell does nothing, and the estates remember the failure.\n\nTake the large one when you know you are not going to be interrupted: a secure capital, a strong treasury, and an engineer who will live through it."
 TV_EU_SIZES_S3_TITLE:0 "Choosing a Size"
 TV_EU_SIZES_TITLE:0 "Project Sizes"
 TV_EU_SUPPORT_LEAD:0 "Support decays through survey and construction. When it runs dry the court offers one chance to buy the project back; after that the project is over."
 TV_EU_SUPPORT_S1_P1_TEXT:0 "Shortly after the debate closes, support starts falling every month. Nothing else in the project drains it."
 TV_EU_SUPPORT_S1_P1_TITLE:0 "Support Decays"
 TV_EU_SUPPORT_S1_P2_TEXT:0 "If the project can already be declared built, it is finished instead. Otherwise this is where it starts to hurt."
 TV_EU_SUPPORT_S1_P2_TITLE:0 "It Reaches Zero"
 TV_EU_SUPPORT_S1_P3_TEXT:0 "Bribe every estate, or make a public statement. Either way, +50 support and the project continues."
 TV_EU_SUPPORT_S1_P3_TITLE:0 "One Reprieve"
 TV_EU_SUPPORT_S1_P4_TEXT:0 "There is no third. The project ends: the engineer is killed, prestige and estate satisfaction are lost with it."
 TV_EU_SUPPORT_S1_P4_TITLE:0 "The Second Time"
 TV_EU_SUPPORT_S1_TITLE:0 "The Road to Failure"
 TV_EU_SUPPORT_S2_E1_TEXT:0 "Twelve months of trade and tax income, split evenly among every estate the country has, with a floor of 100 gold. Expensive but immediate."
 TV_EU_SUPPORT_S2_E1_TITLE:0 "Bribe the Estates"
 TV_EU_SUPPORT_S2_E2_TEXT:0 "#high 50 political influence#! and #high 25 prestige#!. Cheaper in gold, dearer in the things a ruler cannot simply mint."
 TV_EU_SUPPORT_S2_E2_TITLE:0 "A Public Statement"
 TV_EU_SUPPORT_S2_E3_TEXT:0 "Abandoning voluntarily costs the same as failing. If the site is already lost or the country already bankrupt, sometimes the honest answer is to let it go."
 TV_EU_SUPPORT_S2_E3_TITLE:0 "Giving Up"
 TV_EU_SUPPORT_S2_TITLE:0 "The Two Reprieves"
 TV_EU_SUPPORT_TITLE:0 "When a Project Fails"
 TV_EU_SURVEY_LEAD:0 "The survey is where the ground argues back. You pick a location; the surveyors read what it can actually carry, and those readings cap the project for the rest of its life."
 TV_EU_SURVEY_S1_P1_TEXT:0 "Any location you own that meets the wonder's own siting rule. The department lists which do."
 TV_EU_SURVEY_S1_P1_TITLE:0 "Pick a Location"
 TV_EU_SURVEY_S1_P2_TEXT:0 "Survey progress rises at #high 1/10#! of Military skill a month until it reaches 100."
 TV_EU_SURVEY_S1_P2_TITLE:0 "The Meter Fills"
 TV_EU_SURVEY_S1_P3_TEXT:0 "Scale, organization and logistics are each measured: natural suitability plus the engineer's Administrative skill."
 TV_EU_SURVEY_S1_P3_TITLE:0 "Read the Ground"
 TV_EU_SURVEY_S1_P4_TEXT:0 "Confirming fixes the site and the readings. They cannot be improved once construction begins."
 TV_EU_SURVEY_S1_P4_TITLE:0 "Lock the Site"
 TV_EU_SURVEY_S1_TITLE:0 "Choosing the Ground"
 TV_EU_SURVEY_S2_BODY:0 "Choosing a new site is free and often worth doing: a coastal city with a good harbour will out-read an inland village by a wide margin, and the survey meter is the cheapest thing in the whole project to refill.\n\nConfirming a site is what costs you. A site abandoned before confirmation was never spent."
 TV_EU_SURVEY_S2_TITLE:0 "Re-surveying"
 TV_EU_SURVEY_TITLE:0 "Survey"
 TV_EU_TAB_TITLE:0 "Great Projects"
 TV_EU_WONDER_EFFECTS:0 "What Every Level Gives"
 TV_EU_WONDER_EFFECTS_COUNTRY_1:0 "At level I, country-wide"
 TV_EU_WONDER_EFFECTS_COUNTRY_6:0 "At level VI, country-wide"
 TV_EU_WONDER_EFFECTS_LOCAL_6:0 "At level VI, at the site"
 TV_EU_WONDER_EFFECTS_NOTE:0 "The wonder's own effects, exactly as the game applies them, at the first level and at the last. Each level adds the same again, so a level VI wonder carries this six times."
 TV_EU_WONDER_GLANCE:0 "At a Glance"
 TV_EU_WONDER_GLANCE_TEXT:0 "Size fixes the ritual price and how high the monument can be raised; the estate sets who works it and who gains most from its dedication."
 TV_EU_WONDER_RITUALS:0 "Three Dedications"
 TV_EU_WONDER_RITUALS_NOTE:0 "Every wonder is dedicated in one of three styles, or merely opened plain. Each style below shows the effect the game will actually apply, and the societal value it pulls towards. Estate satisfaction is settled when the ritual is confirmed."
 TV_EU_WONDER_SITE:0 "Where It Can Stand"
 TV_EU_WONDER_SITE_EXAMPLE:0 "#T Read against your capital:#!"
 TV_EU_WONDER_SITE_GENERIC:0 "A generic wonder belongs to no place: you choose the site, and the ground decides what it is worth. The requirements below are the wonder's own siting rule, checked against your capital as an example; the department lists every location that passes."
 TV_EU_WONDER_SITE_UNIQUE:0 "A unique wonder belongs to one place in the world, and only the country holding that place can build it. Its site is fixed, so no siting rule applies; the row above names the location."
 TV_EU_WONDER_STANDING:0 "Who Gains"
 TV_EU_WONDER_STANDING_GENERIC:0 "Freely sited, so it can be raised wherever the ground reads best. Small wonders may be raised more than once, which makes them a renewable source of the same reward."
 TV_EU_WONDER_STANDING_REWARD:0 "the ritual reward"
 TV_EU_WONDER_STANDING_UNIQUE:0 "One place, one owner, once. Whoever holds the site builds it, and its dedication is remembered for a century unless the site changes hands."
