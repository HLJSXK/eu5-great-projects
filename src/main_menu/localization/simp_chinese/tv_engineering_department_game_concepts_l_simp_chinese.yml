 # ── 工程部/伟大工程 ──────────────────────────────────
 game_concept_tv_engineering_department: "工程部"
 game_concept_tv_engineering_department_desc: "战役初始化时会为每个国家自动成立的非唯一国际组织。它负责[tv_great_engineer|e]职位，并管理[tv_wonder_construction|e]的每个阶段：[tv_wonder_concept|e]、[tv_wonder_survey|e]、组织、物流，以及最终的[tv_wonder_ceremony|e]。"
 game_concept_tv_engineering_department_europedia_desc: "开始新战役时，或首次在一个既有存档中启用工程部时，该机构都会为每个国家自动成立，成为该国每一项[tv_wonder_construction|e]背后的常设机构。它唯一的官员——[tv_great_engineer|e]——亲自推动整条流程：其行政能力推进[tv_wonder_concept|e]，其军事能力推进[tv_wonder_survey|e]，其任期也决定了最终[tv_wonder_ceremony|e]上谁将被铭记。撤换或失去大工程师不会让已经开工的工程归零，但职位空缺期间，构想与测绘的进度都会停滞，直到有人继任。"

 game_concept_tv_great_engineer: "大工程师"
 game_concept_tv_great_engineer_desc: "领导[tv_engineering_department|e]的任命角色。[tv_great_engineer|e]以国家变量保存，可在[tv_engineering_department|e]面板中任命、更换或撤职。"

 game_concept_tv_wonder_concept: "构想"
 game_concept_tv_wonder_concept_desc: "开启新[tv_wonder_construction|e]的提案阶段。[tv_great_engineer|e]的行政能力每月推进构想进度；完成后，[tv_great_engineer|e]会提出一项可行的[tv_wonder_small|e]、[tv_wonder_medium|e]或[tv_wonder_large|e]方案，供国家推进。"
 game_concept_tv_wonder_concept_europedia_desc: "构想从[tv_great_engineer|e]获得任命的那一刻开始：一条隐藏进度条从0起步，由该官员的行政能力每月小幅推进。行政能力平庸的大工程师可能耗费数年才能完成构想，而如果国家先后任命过几位能力出众的大工程师，此前积累的进度并不会因换人而作废。构想完成时，国家并不能自由挑选方案——大工程师会根据国家当前的承受能力，提出一项可行的[tv_wonder_small|e]、[tv_wonder_medium|e]或[tv_wonder_large|e]工程，供国家推进。"

 game_concept_tv_wonder_survey: "测绘"
 game_concept_tv_wonder_survey_desc: "[tv_wonder_construction|e]的选址评估阶段。测绘进度每月由[tv_great_engineer|e]的军事能力推动，并揭示[tv_wonder_scale_competence|e]、[tv_wonder_logistics_competence|e]与[tv_wonder_organization_competence|e]；读数完成后，国家即可确认建设地点。"
 game_concept_tv_wonder_survey_europedia_desc: "辩论结束后，测绘人员会评估所选地点的三项隐藏素质——[tv_wonder_scale_competence|e]、[tv_wonder_organization_competence|e]与[tv_wonder_logistics_competence|e]，三者都同时融合了地点本身的天然条件与[tv_great_engineer|e]的行政能力。随着测绘进度由大工程师的军事能力逐月推进，三项读数会一同提升；但一旦正式动工，这些读数便无法再改善，因此在勉强可用的地点与耐心等待更优地点之间做取舍，是一项真正需要权衡的抉择。"

 game_concept_tv_wonder_debate: "辩论"
 game_concept_tv_wonder_debate_desc: "[tv_wonder_construction|e]的国内论证阶段。通过满足地产诉求与辩论事件积累[tv_wonder_domestic_support|e]，达到100点后即可宣布辩论结束，进入[tv_wonder_survey|e]阶段。"
 game_concept_tv_wonder_debate_europedia_desc: "在正式动工之前，提议的工程必须先经受国内论证的考验。贵族、市民与教士三大地产各自提出诉求，满足诉求可获得[tv_wonder_domestic_support|e]，辩论事件也会额外给予支持度。支持度上限为200，但只需达到100点即可结束辩论、进入[tv_wonder_survey|e]阶段。支持度并非无限累积：辩论结束后它会逐月衰减，因此若国家已经可以结束辩论，继续拖延收益有限；而如果支持度在获得仪式奖励前一路衰减至0，该工程甚至有彻底流产的风险。"


 game_concept_tv_wonder_ceremony: "仪式"
 game_concept_tv_wonder_ceremony_desc:0 "工程完工后的奉献仪式。通用与独特奇观均可选择三种风格之一，或以朴素方式落成。仪式与成品建筑分别记录；所选风格提供相应奖励和价值观倾向，失去奇观或仪式被淡忘后消失。"
 game_concept_tv_wonder_ceremony_europedia_desc:0 "三种风格都历时24个月，确认时按工程规模收取费用，并结算现有阶层的满意度。完成时授予所选奖励与价值观移动。选择朴素则立即落成，保留完整基础效果与落成奖励，但所有参与阶层都会反对。仪式阶段国内支持度不再流失。独特奇观继承对应通用机制的奖励，使用自己的仪式文本。已奉献奇观扩建时保留仪式；朴素奇观扩建后重新选择。构思期间可通过决议重新奉献朴素奇观。"

 game_concept_tv_wonder_construction: "伟大工程"
 game_concept_tv_wonder_construction_desc: "由[tv_engineering_department|e]管理的伟大工程机制。[tv_great_engineer|e]的[tv_wonder_concept|e]提出可行的[tv_wonder_small|e]、[tv_wonder_medium|e]或[tv_wonder_large|e]方案后，国家化解国内[tv_wonder_debate|e]，完成[tv_wonder_survey|e]并组织劳工。建设随后通过四个[tv_wonder_construction_part|e]推进。每级$tv_wonder_labor_camp$从所在市场消耗工具、木材和砖石，劳工推动工程进度。"
 game_concept_tv_wonder_construction_europedia_desc: "伟大工程把奇观从构想推进到落成。[tv_great_engineer|e]首先完成[tv_wonder_concept|e]，提出一项可行的[tv_wonder_small|e]、[tv_wonder_medium|e]或[tv_wonder_large|e]方案；国家随后化解国内[tv_wonder_debate|e]，由[tv_wonder_survey|e]确认选址。建设通过四个[tv_wonder_construction_part|e]推进，每级$tv_wonder_labor_camp$从所在市场消耗工具、木材和砖石，直至以[tv_wonder_ceremony|e]收尾。已落成的[tv_wonder_generic|e]工程日后还可通过[tv_wonder_expansion|e]继续扩建。"

 game_concept_tv_wonder_expansion: "扩建"
 game_concept_tv_wonder_expansion_desc:0 "在原址提高已落成奇观的等级。完整奇观保留原有仪式并跳过仪式阶段，不重复发放仪式奖励；朴素奇观扩建后可选择仪式或继续朴素落成。勘测能力与基础奖励的规则不变。"

 game_concept_tv_wonder_construction_part: "建设部件"
 game_concept_tv_wonder_construction_part_desc: "[tv_wonder_construction|e]同时推进的四条平行进度之一——基础建设、主体结构、功能实现与封顶装饰。工程的等级取决于四部分中进度最落后的一项，因此进度必须均衡推进，而非只赶完其中一条。"
 game_concept_tv_wonder_construction_part_europedia_desc: "每一座伟大工程实际上都是四座并行推进的建筑——地基、主体、功能与封顶，各自依靠独立的劳力与建材单独推进。工程的总体等级并非四者的平均值，而是取决于进度最落后的那一部分。若把全部资源都投入某一条最显眼的进度，却放任其余三条停滞，只会让整座纪念碑卡在最薄弱那部分的等级上，因此四线均衡推进，胜过抢先冲完其中一条。"

 game_concept_tv_wonder_small: "小型工程"
 game_concept_tv_wonder_small_desc: "[tv_wonder_construction|e]的规模分级。小型工程可以重复建造，但通常只提供本地效果。\n小型工程每提升一级通常约需#Y 10000@gold!#!。"

 game_concept_tv_wonder_medium: "中型工程"
 game_concept_tv_wonder_medium_desc: "[tv_wonder_construction|e]的规模分级，介于小型与大型之间。同一国家不能同时开启第二座同类型的中型工程。\n中型工程每提升一级通常约需#Y 20000@gold!#!。"

 game_concept_tv_wonder_large: "大型工程"
 game_concept_tv_wonder_large_desc: "[tv_wonder_construction|e]的规模分级。同一国家不能同时开启第二座同类型的大型工程。\n大型工程每提升一级通常约需#Y 30000@gold!#!。"

 game_concept_tv_wonder_generic: "通用奇观"
 game_concept_tv_wonder_generic_desc: "由[tv_great_engineer|e]提议、可自由选址建造的[tv_wonder_small|e]、[tv_wonder_medium|e]或[tv_wonder_large|e]规模[tv_wonder_construction|e]，与预先固定于地图上的[tv_wonder_unique|e]相对。落成时可选择一种[tv_wonder_ceremony|e]风格。"
 game_concept_tv_wonder_generic_europedia_desc: "通用奇观不受任何固定地点束缚：一旦[tv_wonder_survey|e]确认某处地点合适，国家便可自行选择在此建造[tv_great_engineer|e]所提出的[tv_wonder_small|e]、[tv_wonder_medium|e]或[tv_wonder_large|e]方案。小型通用工程甚至可以在新地点反复建造，让国家能够重复获取该原型的仪式奖励——这与[tv_wonder_unique|e]截然不同，后者在整局游戏中只存在唯一的一座、位于唯一的地点。"

 game_concept_tv_wonder_unique: "独特奇观"
 game_concept_tv_wonder_unique_desc: "预先固定于地图特定地点的历史性[tv_wonder_construction|e]，与国家自由选址建造的[tv_wonder_generic|e]相对。大多数独特奇观在建设完成后会自动依次推进8阶段的[tv_wonder_ceremony|e]，少数拥有专属手动仪式流程。"
 game_concept_tv_wonder_unique_europedia_desc: "独特奇观从游戏开局起便被固定在现实世界中的某一处具体地点，也只有实际掌控该地点的国家才有机会将其建成——不像[tv_wonder_generic|e]那样可以自由选址。作为这种历史固定性的交换，模组中136座独特奇观里有134座在竣工后共享同一套统一、自动推进的八阶段[tv_wonder_ceremony|e]，无需玩家再做任何操作即可获得永久奖励。亚历山大灯塔与圣索菲亚大教堂是仅有的两个例外，各自拥有专属的多步骤仪式流程。"

 game_concept_tv_wonder_domestic_support: "国内支持度"
 game_concept_tv_wonder_domestic_support_desc: "[tv_wonder_construction|e]资源，代表精英与公众对一项大型伟大工程的支持。达到100即可结束初始辩论；支持度最多储存到200，并会在辩论结束后逐月衰减。每轮建设中支持度第一次耗尽时，宫廷会给出最后一次挽回工程的机会；第二次耗尽时，工程将直接崩溃。"

 game_concept_tv_wonder_scale_competence: "规模适性"
 game_concept_tv_wonder_scale_competence_desc: "[tv_wonder_survey|e]读数，衡量选址能否承载工程预期的尺度、轴线、地基与公共入口，而不至于把设计压成尴尬的形状。它以20%、40%、60%、80%、100%为分界决定伟大工程最大等级，6级工程需要100%适性。"

 game_concept_tv_wonder_organization_competence: "组织适性"
 game_concept_tv_wonder_organization_competence_desc: "[tv_wonder_survey|e]读数，衡量劳役名册、工头、工坊与施工阶段能否听命于同一张计划，而不是被互相竞争的号令拉扯。它以0%到100%线性决定0到20级工地最大等级。"

 game_concept_tv_wonder_logistics_competence: "物流适性"
 game_concept_tv_wonder_logistics_competence_desc: "[tv_wonder_survey|e]对道路、车队、港口、桥梁和交接点进行评估，决定物资能否在需要时抵达工地。"

