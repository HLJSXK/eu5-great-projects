 TV_EU_CATALOGUE_NOTE:0 "各列为等级总效果 · 仪式持续效果 100 年，一次性奖励另列"
 TV_EU_CEREMONY_LEAD:0 "已建成的奇观在落成之前只是空壳。可供选择三种仪式风格；每一种赋予奇观不同的永久性格与不同的奖励组合，也各自要花金币、耗时两年。"
 TV_EU_CEREMONY_S1_P1_TEXT:0 "已建成、矗立着，却几乎不起作用。落成之前，它只带来文化传统。"
 TV_EU_CEREMONY_S1_P1_TITLE:0 "空壳"
 TV_EU_CEREMONY_S1_P2_TEXT:0 "三种风格都可免费预览，每一个都以游戏自身的渲染方式显示其真实的完成效果，而非概述。"
 TV_EU_CEREMONY_S1_P2_TITLE:0 "选择风格"
 TV_EU_CEREMONY_S1_P3_TEXT:0 "确认时收取一笔随规模缩放的费用，并当场结算每一个在场阶层的好感，或升或降。"
 TV_EU_CEREMONY_S1_P3_TITLE:0 "付费与结算"
 TV_EU_CEREMONY_S1_P4_TEXT:0 "仪式持续 24 个月。期间支持度不衰减，风格也不能再改。"
 TV_EU_CEREMONY_S1_P4_TITLE:0 "两年"
 TV_EU_CEREMONY_S1_TITLE:0 "落成如何发生"
 TV_EU_CEREMONY_S2_E1_TEXT:0 "小、中、大奇观分别为 #high 2#!、#high 3#!、#high 5#! 倍缩放金。确认之时即扣款之时。"
 TV_EU_CEREMONY_S2_E1_TITLE:0 "按规模定价"
 TV_EU_CEREMONY_S2_E2_TEXT:0 "支持你选定风格的阶层好感 #high +0.10#!，反对者 #high −0.05#!。既然三种风格彼此对立，总会有阶层为此付出。"
 TV_EU_CEREMONY_S2_E2_TITLE:0 "阶层好感，一次结算"
 TV_EU_CEREMONY_S2_E3_TEXT:0 "完成仪式后，沿所选社会价值观方向提供 #high 0.1#! 月度推力。"
 TV_EU_CEREMONY_S2_E3_TITLE:0 "月度价值观倾向"
 TV_EU_CEREMONY_S2_E4_TEXT:0 "一次落成持续 100 年，或直到该地易主、建筑被拆。落成过期之后，奇观退回朴素状态。"
 TV_EU_CEREMONY_S2_E4_TITLE:0 "百年记忆"
 TV_EU_CEREMONY_S2_TITLE:0 "三种风格共通之处"
 TV_EU_CEREMONY_S3_A1_TEXT:0 "即时、免费，仍照发落成奖励。但每个参与的阶层都对此不满，奇观也完全没有仪式性格。"
 TV_EU_CEREMONY_S3_A1_TITLE:0 "朴素启用"
 TV_EU_CEREMONY_S3_A2_TEXT:0 "两年与一笔费用，换来奇观保有风格、其奖励、其价值牵引，以及支持它的那些阶层。"
 TV_EU_CEREMONY_S3_A2_TITLE:0 "仪式落成"
 TV_EU_CEREMONY_S3_SIGN:0 "或"
 TV_EU_CEREMONY_S3_TITLE:0 "朴素，或落成"
 TV_EU_CEREMONY_S4_BODY:0 "每次扩建结束都能重新自由选择三种仪式风格，或选择朴素落成。旧仪式持续到本次落成，届时由新选择替代。举行仪式仍按正常规则支付费用、等待完成、结算阶层态度并领取仪式奖励。"
 TV_EU_CEREMONY_S4_TITLE:0 "扩建已落成的奇观"
 TV_EU_CEREMONY_TITLE:0 "落成"
 TV_EU_COMPETENCES_LEAD:0 "勘测会得出三项读数。规模封顶奇观等级，组织封顶你能投入的劳动力规模，后勤决定施工实际推进的速度。"
 TV_EU_COMPETENCES_S1_BODY:0 "每跨越一档即可多建一级。#high 六级#! 需要满 100，所以贫瘠的地基无论砸多少钱都推不到顶。「施工流程调整」设置可以彻底解除上限，留给更想建造、而不是与地理讨价还价的玩家。"
 TV_EU_COMPETENCES_S1_K1:0 "20\n一级"
 TV_EU_COMPETENCES_S1_K2:0 "40\n二级"
 TV_EU_COMPETENCES_S1_K3:0 "60\n三级"
 TV_EU_COMPETENCES_S1_K4:0 "80\n四级"
 TV_EU_COMPETENCES_S1_K5:0 "100\n五级"
 TV_EU_COMPETENCES_S1_K6:0 "+ 设置\n六级"
 TV_EU_COMPETENCES_S1_TITLE:0 "规模：等级上限"
 TV_EU_COMPETENCES_S2_A1_TEXT:0 "除以五，即为工地可建劳工营的最高等级，上限 #high 20#!。劳工营就是劳动力：没有营，就没有进度。"
 TV_EU_COMPETENCES_S2_A1_TITLE:0 "组织"
 TV_EU_COMPETENCES_S2_A2_TEXT:0 "加上五十，即为进度的百分比乘数：读数 0 也仍有半速，读数 100 则达 #high 150%#!。"
 TV_EU_COMPETENCES_S2_A2_TITLE:0 "后勤"
 TV_EU_COMPETENCES_S2_SIGN:0 "或"
 TV_EU_COMPETENCES_S2_TITLE:0 "组织与后勤"
 TV_EU_COMPETENCES_S3_BODY:0 "能力是地基天然适宜度与总工程师行政能力的混合，而地基那一半通常更大。同一个国家的两处地点可以相差几十点，只因为一处是河畔都城，另一处是山间村落。\n\n$BULLET$ 首都、城市、港口、河流与道路都会提高读数。\n$BULLET$ 山地、湿地、丛林与恶劣气候会降低读数。\n$BULLET$ 发展度与既有建筑会提高读数：所以富庶繁忙之地最适合建奇观，也最难找到空地。"
 TV_EU_COMPETENCES_S3_TITLE:0 "为什么地基比人更关键"
 TV_EU_COMPETENCES_TITLE:0 "勘测能力"
 TV_EU_CONCEPTION_LEAD:0 "总工程师判断这个国家能建什么，并把三份方案摆在你面前。你可以接受其一、花小代价驳回，或出钱换一批。"
 TV_EU_CONCEPTION_S1_P1_TEXT:0 "构想进度每月按行政能力增长，直至 100。"
 TV_EU_CONCEPTION_S1_P1_TITLE:0 "进度积累"
 TV_EU_CONCEPTION_S1_P2_TEXT:0 "总工程师提出至多三份工程，其规模都在国家当下能真正承受的范围内。"
 TV_EU_CONCEPTION_S1_P2_TITLE:0 "三份方案"
 TV_EU_CONCEPTION_S1_P3_TEXT:0 "小、中、大。规模决定仪式价格、每单元施工需求，以及可重复建造的次数上限。"
 TV_EU_CONCEPTION_S1_P3_TITLE:0 "选定规模"
 TV_EU_CONCEPTION_S1_P4_TEXT:0 "接受即锁定奇观并开启国内辩论。此时尚未支出分文。"
 TV_EU_CONCEPTION_S1_P4_TITLE:0 "接受"
 TV_EU_CONCEPTION_S1_TITLE:0 "提案如何成为工程"
 TV_EU_CONCEPTION_S2_E1_TEXT:0 "按原样接受提案，进入[tv_wonder_debate|e]。免费。"
 TV_EU_CONCEPTION_S2_E1_TITLE:0 "接受"
 TV_EU_CONCEPTION_S2_E2_TEXT:0 "付出少量 #high 威望#! 后退回构想。当三份方案都与本国的地理条件不合时使用。"
 TV_EU_CONCEPTION_S2_E2_TITLE:0 "驳回"
 TV_EU_CONCEPTION_S2_E3_TEXT:0 "付出一笔随规模缩放 #high 金币#!，立即重抽一批。是用钱继续挑选的方式。"
 TV_EU_CONCEPTION_S2_E3_TITLE:0 "贿赂"
 TV_EU_CONCEPTION_S2_TITLE:0 "三种回应"
 TV_EU_CONCEPTION_TITLE:0 "构想"
 TV_EU_CONSTRUCTION_LEAD:0 "四个部件从同一座劳工营同时升起。奇观等级等于最慢那个部件的等级，所以只喂一个部件、饿着其余，是最常见的虚耗十年之法。"
 TV_EU_CONSTRUCTION_S1_P1_TEXT:0 "清场、平整、排水与最初的几层砌石。"
 TV_EU_CONSTRUCTION_S1_P1_TITLE:0 "地基"
 TV_EU_CONSTRUCTION_S1_P2_TEXT:0 "建筑的本体：墙、墩、拱，从远处看得见的那一部分。"
 TV_EU_CONSTRUCTION_S1_P2_TITLE:0 "主体"
 TV_EU_CONSTRUCTION_S1_P3_TEXT:0 "奇观真正起作用的部分：码头、粮仓、厅堂、水系、哨望。"
 TV_EU_CONSTRUCTION_S1_P3_TITLE:0 "功能"
 TV_EU_CONSTRUCTION_S1_P4_TEXT:0 "穹顶、尖塔、贴金与铭文：让它成为奇观而非一座大楼的部分。"
 TV_EU_CONSTRUCTION_S1_P4_TITLE:0 "冠饰"
 TV_EU_CONSTRUCTION_S1_TITLE:0 "四个部件"
 TV_EU_CONSTRUCTION_S2_BODY:0 "每月进度同时来自四样东西，任何一样都可能成为瓶颈：\n\n$BULLET$ #T 劳工营：#! 每个有效等级每月提供固定进度。等级上限来自组织能力，而它每月光是维持就要消耗 #high 工具与奇观建材#!。\n$BULLET$ #T 就业：#! 岗位空缺的营地什么也产出不了。那个地点要有劳工，而不只是有一栋建筑。\n$BULLET$ #T 投入品：#! 营地在本地市场采购材料。建材工坊提供八种工艺，每种产出1.00份建材。夯土、木构和烧砖无需外购工具，石材精加工与标准化构件则发挥成熟产业的优势。应按市场价格与供应选择工艺，也可以通过贸易进口。市场贫弱，营地就空着手。\n$BULLET$ #T 后勤：#! 勘测读数，以 50% 到 150% 的乘数作用在以上所有产出上。"
 TV_EU_CONSTRUCTION_S2_TITLE:0 "真正推动工程的东西"
 TV_EU_CONSTRUCTION_S3_A1_TEXT:0 "慢而稳。所有部件同时到达新等级，奇观逐级抬升，不会有任何部件被白白建到高于其余部件的位置。"
 TV_EU_CONSTRUCTION_S3_A1_TITLE:0 "四部齐进"
 TV_EU_CONSTRUCTION_S3_A2_TEXT:0 "在面板里好看，在奇观上无用。其余三个部件会把等级死死按在原处，直到它们追上来。"
 TV_EU_CONSTRUCTION_S3_A2_TITLE:0 "单推一部"
 TV_EU_CONSTRUCTION_S3_SIGN:0 "或"
 TV_EU_CONSTRUCTION_S3_TITLE:0 "均衡还是催工"
 TV_EU_CONSTRUCTION_S4_E1_TEXT:0 "本轮至少要比起始等级高出一级，然后宣布建成。提前宣布是允许的，有时也明智：一座现在就能落成的三级奇观，胜过一个你养不起的六级奇观。"
 TV_EU_CONSTRUCTION_S4_E1_TITLE:0 "宣布建成"
 TV_EU_CONSTRUCTION_S4_E2_TEXT:0 "部件已建、却从未落成的奇观会以空壳形式存在。主体建到一级即可宣布建成，于是后来的统治者能接手前人未竟之事。"
 TV_EU_CONSTRUCTION_S4_E2_TITLE:0 "续建空壳"
 TV_EU_CONSTRUCTION_S4_E3_TEXT:0 "若该地点易主，工程立即中止，并支付失败代价。已砌好的石料留在原处，夺取此地的征服者可以续建。"
 TV_EU_CONSTRUCTION_S4_E3_TITLE:0 "失去工地"
 TV_EU_CONSTRUCTION_S4_TITLE:0 "完工，或不完工"
 TV_EU_CONSTRUCTION_TITLE:0 "施工"
 TV_EU_DEBATE_LEAD:0 "在动第一块石头之前，贵族、市民与教士各有所求。满足足够多的诉求，国内支持度达到 100，辩论即告结束。"
 TV_EU_DEBATE_S1_BODY:0 "[tv_wonder_domestic_support|e] 是这个国家愿意继续为他人纪念碑掏钱的程度。取值#high 0 到 200#!，也是唯一能让工程当场终止的数值。\n\n辩论结束之后，支持度不再是目标，而成了倒计时。整个勘测与施工期间它每月衰减，而重新把它补回来，远比当初挣到它更难。"
 TV_EU_DEBATE_S1_TITLE:0 "支持度是什么"
 TV_EU_DEBATE_S2_BODY:0 "支持度既会积攒也会流失：每接受一项诉求固定 +20，辩论事件也可能以同样的幅度加减。达到 200 时辩论会自动结束，不论你是否准备好；因此把进度条压满的唯一理由，就是把这部分盈余带进随后的衰减期。"
 TV_EU_DEBATE_S2_K1:0 "0\n辩论以失败告终"
 TV_EU_DEBATE_S2_K2:0 "100\n可结束辩论"
 TV_EU_DEBATE_S2_K3:0 "200\n自动结束"
 TV_EU_DEBATE_S2_TITLE:0 "辩论的区间"
 TV_EU_DEBATE_S3_E1_TEXT:0 "没有市民阶层的国家，就少一项诉求要满足。辩论从不会索要国家本就没有的东西。"
 TV_EU_DEBATE_S3_E1_TITLE:0 "只有在场的阶层参与"
 TV_EU_DEBATE_S3_E2_TEXT:0 "任何诉求都可以用一笔随规模缩放的金币打发了事，代价是该阶层会重新抽取一项诉求。金币是唯一能让这个阶段变得无害的资源。"
 TV_EU_DEBATE_S3_E2_TITLE:0 "花钱脱身"
 TV_EU_DEBATE_S3_E3_TEXT:0 "辩论结束后第一次归零，朝廷会给出一次挽救机会：收买各阶层，或由君主公开表态。第二次归零，工程即告终止。"
 TV_EU_DEBATE_S3_E3_TITLE:0 "耗尽之后"
 TV_EU_DEBATE_S3_TITLE:0 "读懂局势"
 TV_EU_DEBATE_TITLE:0 "国内辩论"
 TV_EU_DEMANDS_LEAD:0 "每一项诉求都是从你自己的国库或特权里真实割出去的东西。种类并不多，每一种在你接受之前都能读到对应的提示。"
 TV_EU_DEMANDS_S1_E1_TEXT:0 "该阶层一项尚未授予的特权被永久授予，且不收费。看起来最便宜的诉求，往往代价最长久。"
 TV_EU_DEMANDS_S1_E1_TITLE:0 "授予特权"
 TV_EU_DEMANDS_S1_E2_TEXT:0 "为该阶层减免税负或征召义务五年。它会自行失效，因此是最容易接受的诉求。"
 TV_EU_DEMANDS_S1_E2_TITLE:0 "减轻负担"
 TV_EU_DEMANDS_S1_E3_TEXT:0 "颁布该阶层偏好的政策，并照旧支付其稳定度代价。你未必总能付得起。"
 TV_EU_DEMANDS_S1_E3_TITLE:0 "更改政策"
 TV_EU_DEMANDS_S1_E4_TEXT:0 "损失威望、稳定度或正统性，得罪另一个阶层，或来一次轻度通胀。看得明白，也付得明白。"
 TV_EU_DEMANDS_S1_E4_TITLE:0 "惩罚"
 TV_EU_DEMANDS_S1_E5_TEXT:0 "阁员被逐出内阁、艺术家被处死、艺术品被销毁。这是超出账面的伤害。"
 TV_EU_DEMANDS_S1_E5_TITLE:0 "牺牲"
 TV_EU_DEMANDS_S1_TITLE:0 "诉求的种类"
 TV_EU_DEMANDS_S2_BODY:0 "接受通常是对的，因为 #high 20 点支持度#! 比多数单项代价更值钱，而且金币能让你绕过任何你不愿接受的东西。\n\n唯一值得犹豫的是授予特权：它是唯一不会回到你手上的代价。若各阶层本已势大，用威望或金币驳回它，通常是更划算的交易。"
 TV_EU_DEMANDS_S2_TITLE:0 "你真正的选择"
 TV_EU_DEMANDS_TITLE:0 "阶层诉求"
 TV_EU_DEPARTMENT_LEAD:0 "一个常设机构，一名官员，同一时间只推进一个工程。维持它不需要花费，而一切奇观只能从这里开始。"
 TV_EU_DEPARTMENT_S1_BODY:0 "从战役第一天起，每个国家都在工程部中拥有席位，无论它是否真的打算建造什么。工程部并不施工，它持有工程：记住哪座奇观正在推进、每个部件建到多高、勘测师量到了什么、支持度是否崩塌过，以及落成时谁有权被记住。\n\n正因为工程存在于部门而不存在于建筑里，奇观不会因为失去总工程师、失去工地、或停摆数十年而消失。只有放弃工程或彻底失败，才会结束这一轮。"
 TV_EU_DEPARTMENT_S1_TITLE:0 "这个机构是什么"
 TV_EU_DEPARTMENT_S2_E1_TEXT:0 "哪一座奇观、什么规模、选在何处、处于哪一阶段。同一时间只推进一个：第二个工程要等第一个建成、放弃或失败。"
 TV_EU_DEPARTMENT_S2_E1_TITLE:0 "当前奇观"
 TV_EU_DEPARTMENT_S2_E2_TEXT:0 "构想与勘测进度、四个部件的计数，以及限制下游一切的三项勘测读数。"
 TV_EU_DEPARTMENT_S2_E2_TITLE:0 "进度与能力"
 TV_EU_DEPARTMENT_S2_E3_TEXT:0 "当前国内支持度、本轮唯一一次挽救是否已用掉，以及辩论中哪个阶层提了什么要求。"
 TV_EU_DEPARTMENT_S2_E3_TITLE:0 "支持度与阶层情绪"
 TV_EU_DEPARTMENT_S2_TITLE:0 "它记住什么"
 TV_EU_DEPARTMENT_TITLE:0 "工程部"
 TV_EU_ENGINEER_LEAD:0 "智与行皆系于一人。行政能力决定构想多快，军事能力决定勘测多快，而落成之后，碑上刻的是他的名字。"
 TV_EU_ENGINEER_S1_E1_TEXT:0 "每月构想进度增加 #high 1/5#! 的行政能力。行政能力 10 即每月 2 点；进度条满值为 100。"
 TV_EU_ENGINEER_S1_E1_TITLE:0 "行政能力 · 构想"
 TV_EU_ENGINEER_S1_E2_TEXT:0 "每月勘测进度增加 #high 1/10#! 的军事能力，而只有勘测才能确认地基。一位能干的总工程师加上一块好地基，正是三级纪念碑与六级纪念碑的全部差别。"
 TV_EU_ENGINEER_S1_E2_TITLE:0 "军事能力 · 勘测"
 TV_EU_ENGINEER_S1_E3_TEXT:0 "这是一项挂在人物身上的职务，而非终身任命。撤换之后，继任者从工程当前进度接手；但职位空缺期间构想与勘测会冻结，施工与仪式则照常进行。"
 TV_EU_ENGINEER_S1_E3_TITLE:0 "任期"
 TV_EU_ENGINEER_S1_TITLE:0 "各项能力的作用"
 TV_EU_ENGINEER_S2_BODY:0 "只需看工程真正消耗的那两项能力：行政用于下一步，军事用于选址。一位年迈而能力极高者，往往胜过一位年轻天才，因为工程以年计，而总工程师一死，两个最要紧的进度条都会停下。\n\n这个职位没有经验、没有培训、没有晋升。总工程师只是筛子，决定你的工程有多快，如此而已。"
 TV_EU_ENGINEER_S2_TITLE:0 "如何挑选"
 TV_EU_ENGINEER_TITLE:0 "总工程师"
 TV_EU_EXPANSION_LEAD:0 "建成并不是终点。奇观可以继续建高，而朴素状态的奇观也能补上当初没有举行的落成。"
 TV_EU_EXPANSION_S1_E1_TEXT:0 "在同一工地开启新一轮施工，自带勘测读数与自有奖励。无论原有仪式如何，都在结束时重新自由选择仪式。"
 TV_EU_EXPANSION_S1_E1_TITLE:0 "扩建"
 TV_EU_EXPANSION_S1_E2_TEXT:0 "在构思期间可用的一项决议。它把朴素奇观直接送进仪式，跳过辩论、勘测与施工。"
 TV_EU_EXPANSION_S1_E2_TITLE:0 "重新仪式"
 TV_EU_EXPANSION_S1_TITLE:0 "两条回头的路"
 TV_EU_EXPANSION_S2_A1_TEXT:0 "每次都有完整的落成奖励，奇观等级提升。举行仪式会再次结算其奖励，并替换该地点的旧风格；选择朴素落成则移除原有仪式。"
 TV_EU_EXPANSION_S2_A1_TITLE:0 "扩建"
 TV_EU_EXPANSION_S2_A2_TEXT:0 "仅获得所选仪式的奖励。选择朴素不获得额外奖励。"
 TV_EU_EXPANSION_S2_A2_TITLE:0 "重新仪式"
 TV_EU_EXPANSION_S2_SIGN:0 "或"
 TV_EU_EXPANSION_S2_TITLE:0 "两者各得什么"
 TV_EU_EXPANSION_TITLE:0 "扩建与重新仪式"
 TV_EU_FILTER_ALL:0 "全部"
 TV_EU_FILTER_ALL_TOOLTIP:0 "打开全部页签。"
 TV_EU_FILTER_GENERIC:0 "通用工程"
 TV_EU_FILTER_GENERIC_TOOLTIP:0 "打开通用工程页签。"
 TV_EU_FILTER_MECHANICS:0 "完整机制"
 TV_EU_FILTER_MECHANICS_TOOLTIP:0 "打开完整机制页签。"
 TV_EU_FILTER_OVERVIEW:0 "入门"
 TV_EU_FILTER_OVERVIEW_TOOLTIP:0 "打开入门页签。"
 TV_EU_FILTER_UNIQUE:0 "独特工程"
 TV_EU_FILTER_UNIQUE_TOOLTIP:0 "打开独特工程页签。"
 TV_EU_KINDS_LEAD:0 "本目录中的每一座奇观都属于两类之一：一种是你可在许可地基上自行选址的原型，一种是属于世上唯一某地的纪念碑。"
 TV_EU_KINDS_S1_A1_TEXT:0 "由你选址，因此可以把它放在勘测读数最高之处。小型可重复建造，是稳定刷取某种奖励的可靠方式。奇观是什么，取决于你的国家把它造成什么。"
 TV_EU_KINDS_S1_A1_TITLE:0 "通用"
 TV_EU_KINDS_S1_A2_TEXT:0 "一地、一主、一座。你无法选择地基，也可能有人先你一步占据它。作为回报，其基础效果翻倍，奖励值得等待。"
 TV_EU_KINDS_S1_A2_TITLE:0 "独特"
 TV_EU_KINDS_S1_SIGN:0 "或"
 TV_EU_KINDS_S1_TITLE:0 "取舍"
 TV_EU_KINDS_S2_BODY:0 "开局时世上已有许多这样的纪念碑矗立着，归其所在地的持有者所有，处于朴素状态。它们只提供基础效果，直到有人为它举行落成仪式；于是战役里最早的一块肥肉，往往就是邻国正坐着的那座。\n\n夺取它自有代价：新主人要决定是保留它、以守护者之名换取威望，还是拆走珍宝换取金币，代价是降低一级。"
 TV_EU_KINDS_S2_TITLE:0 "开局的历史奇观"
 TV_EU_KINDS_TITLE:0 "通用与独特奇观"
 TV_EU_OVERVIEW_LEAD:0 "#F 在城市的天际线上留下属于你的丰碑吧。任命一位总工程师，说服贵族、市民与教士，勘测选址，一砖一石把奇观垒向云端。#!"
 TV_EU_OVERVIEW_S1_NOTE:0 "七步依次推进，沿圆环顺时针排列。下面的教程也按这个顺序展开。"
 TV_EU_OVERVIEW_S1_P1_TEXT:0 "职位空着，什么都别想开始。"
 TV_EU_OVERVIEW_S1_P1_TITLE:0 "任命"
 TV_EU_OVERVIEW_S1_P2_TEXT:0 "工程师提案，你从三选一。"
 TV_EU_OVERVIEW_S1_P2_TITLE:0 "构想"
 TV_EU_OVERVIEW_S1_P3_TEXT:0 "各阶层开价，支持度要够 100。"
 TV_EU_OVERVIEW_S1_P3_TITLE:0 "辩论"
 TV_EU_OVERVIEW_S1_P4_TEXT:0 "丈量地基：此后一切的上限。"
 TV_EU_OVERVIEW_S1_P4_TITLE:0 "勘测"
 TV_EU_OVERVIEW_S1_P5_TEXT:0 "工地出劳力，物流定快慢。"
 TV_EU_OVERVIEW_S1_P5_TITLE:0 "组织"
 TV_EU_OVERVIEW_S1_P6_TEXT:0 "一次推一个部件，最弱那个定等级。"
 TV_EU_OVERVIEW_S1_P6_TITLE:0 "施工"
 TV_EU_OVERVIEW_S1_P7_TEXT:0 "郑重仪式或朴素启用，此后永久生效。"
 TV_EU_OVERVIEW_S1_P7_TITLE:0 "落成"
 TV_EU_OVERVIEW_S1_TITLE:0 "全流程一览"
 TV_EU_OVERVIEW_S2_BODY:0 "打开[tv_engineering_department|e]面板，在页眉点击「任命大工程师」，选一位[character|e]担任[tv_great_engineer|e]。这个职位空着的时候，[tv_wonder_concept|e]和[tv_wonder_survey|e]都会停下。"
 TV_EU_OVERVIEW_S2_R1_TEXT:0 "在任命之前，面板就显示这一状态，下一步提示写着「任命工程师」。其余功能全部锁住。"
 TV_EU_OVERVIEW_S2_R1_TITLE:0 "页眉先告诉你卡在哪"
 TV_EU_OVERVIEW_S2_R2_TEXT:0 "点页眉里那个空头像，游戏会让你挑人。选中的角色一直担任此职，直到你换人或免职。"
 TV_EU_OVERVIEW_S2_R2_TITLE:0 "空头像就是按钮"
 TV_EU_OVERVIEW_S2_R3_TEXT:0 "任命之后，页眉会出现「更换」和「免职」两个按钮，都不花钱，但已经开工的工程进度会保留。"
 TV_EU_OVERVIEW_S2_R3_TITLE:0 "换人和免职都不花钱"
 TV_EU_OVERVIEW_S2_TITLE:0 "第一步 任命大工程师"
 TV_EU_OVERVIEW_S3_BODY:0 "每个月构想进度增加大工程师[adm|e]的 0.2 倍，满 100 后会出现三项提案。点「查看第一提案」等按钮可以阅读简报，选好后点「接受提案」，就锁定了奇观和它的规模（[tv_wonder_small|e]、[tv_wonder_medium|e]或[tv_wonder_large|e]）。三项都不满意的话，可以用以下方式换一组新提案。"
 TV_EU_OVERVIEW_S3_R1_TEXT:0 "只有[tv_great_engineer|e]在任时这条进度才会走，每月涨其[adm|e]的 0.2 倍。行政能力越高构想越快，除此之外没有任何东西能推动它。"
 TV_EU_OVERVIEW_S3_R1_TITLE:0 "这条进度是任命的回报"
 TV_EU_OVERVIEW_S3_R2_TEXT:0 "满 100 后进度条会换成三个提案按钮。提交之前先悬停读一读它的等级、效果和规模。"
 TV_EU_OVERVIEW_S3_R2_TITLE:0 "三项提案，只能选一项"
 TV_EU_OVERVIEW_S3_R3_TEXT:0 "「接受」把奇观和规模定死，整局工程都按它来。「驳倒」花 10 [prestige|e]、「拨款」花一笔缩放[gold|e]，都是换一组新的三个提案。"
 TV_EU_OVERVIEW_S3_R3_TITLE:0 "接受才锁定，另外两个只是重抽"
 TV_EU_OVERVIEW_S3_R4_TEXT:0 "每项提案自带规模。规模决定[tv_wonder_construction|e]造价、每个部件的单元数，以及之后仪式的价钱。"
 TV_EU_OVERVIEW_S3_R4_TITLE:0 "规模写在提案里"
 TV_EU_OVERVIEW_S3_TITLE:0 "第二步 构想并接受提案"
 TV_EU_OVERVIEW_S4_BODY:0 "[tv_wonder_debate|e]阶段，[ShowEstateTypeName('nobles_estate')]、[ShowEstateTypeName('burghers_estate')]和[ShowEstateTypeName('clergy_estate')]会各提一项诉求。每项诉求有三种处理方式。"
 TV_EU_OVERVIEW_S4_R1_TEXT:0 "上面那条是[tv_wonder_domestic_support|e]，目标 100。下面的小字写的是辩论允许你囤到的上限 200，所以超出 100 的部分不要白扔。"
 TV_EU_OVERVIEW_S4_R1_TITLE:0 "一个要够，一个可以存"
 TV_EU_OVERVIEW_S4_R2_TEXT:0 "每个阶层提一项诉求，各带各的价码。先读三项再动手不花钱，也能看出这轮哪种回应最便宜。"
 TV_EU_OVERVIEW_S4_R2_TITLE:0 "三个阶层，三项诉求"
 TV_EU_OVERVIEW_S4_R3_TEXT:0 "「接受」拿 20 点[tv_wonder_domestic_support|e]，同时付清诉求的代价。「驳倒」花 10 [prestige|e]、「贿赂」花缩放[gold|e]，都只是把这一项换成别的，也就是重摇价码。"
 TV_EU_OVERVIEW_S4_R3_TITLE:0 "接受、驳倒或贿赂"
 TV_EU_OVERVIEW_S4_R4_TEXT:0 "支持度够了不会自动结束辩论。到 100 以上之后，点这条按钮。"
 TV_EU_OVERVIEW_S4_R4_TITLE:0 "结束辩论要手动点"
 TV_EU_OVERVIEW_S4_TITLE:0 "第三步 赢得辩论"
 TV_EU_OVERVIEW_S5_BODY:0 "点「指派测绘地点」，选一处本国[location|e]。每个月测绘进度增加大工程师[mil|e]的 0.1 倍，满 100 后会得出三项读数。"
 TV_EU_OVERVIEW_S5_R1_TEXT:0 "它由大工程师的[mil|e]推动，与[adm|e]无关，每点每月 0.1。你选的工地不改变速度，只改变读数。"
 TV_EU_OVERVIEW_S5_R1_TITLE:0 "测绘进度是第二条进度"
 TV_EU_OVERVIEW_S5_R2_TEXT:0 "「指派测绘地点」打开地图选点。「重新执行测绘」会丢掉这次读数重来一遍，时间照样要再花一次。"
 TV_EU_OVERVIEW_S5_R2_TITLE:0 "先指地方，不满意再测一次"
 TV_EU_OVERVIEW_S5_R3_TEXT:0 "[tv_wonder_scale_competence|e]决定奇观最高能建到几级，以 20、40、60、80、100 分档，6 级需要满 100；[tv_wonder_organization_competence|e]决定工地等级上限；[tv_wonder_logistics_competence|e]决定施工速度乘数。"
 TV_EU_OVERVIEW_S5_R3_TITLE:0 "三项读数"
 TV_EU_OVERVIEW_S5_R4_TEXT:0 "在点之前，读数只是预览；点了之后，它们就是这项工程永久的上限。所以提交前把三项都看一遍。"
 TV_EU_OVERVIEW_S5_R4_TITLE:0 "确认之后不可更改"
 TV_EU_OVERVIEW_S5_TITLE:0 "第四步 测绘并锁定工地"
 TV_EU_OVERVIEW_S6_BODY:0 "选址确认后，面板上的「组织和物流」卡解锁。"
 TV_EU_OVERVIEW_S6_R1_TEXT:0 "[tv_wonder_organization_competence|e]就是等级上限。在工地所在[market|e]里最多修这么多级[ShowBuildingTypeName('tv_wonder_labor_camp')]，每级正常运转每月提供 1000 点进度。"
 TV_EU_OVERVIEW_S6_R1_TITLE:0 "组织决定能建几座工地"
 TV_EU_OVERVIEW_S6_R2_TEXT:0 "「基础进度」是工地能产出的量；「雇佣」是岗位填满的比例，靠当地[ShowPopTypeName('laborers')]，空缺按比例削减进度；「总维护费」是每月开支。"
 TV_EU_OVERVIEW_S6_R2_TITLE:0 "工地卡上的四个数"
 TV_EU_OVERVIEW_S6_R3_TEXT:0 "工地每月消耗[ShowGoodsName('tools')]和[ShowGoodsName('tv_wonder_materials')]。要盯的是「需求 / 供给」这一栏，供给不够时靠进口或[ShowBuildingTypeName('tv_wonder_material_dispatch_point')]补上。"
 TV_EU_OVERVIEW_S6_R3_TITLE:0 "两种物资，各看两个数"
 TV_EU_OVERVIEW_S6_R4_TEXT:0 "每月进度 = 工地进度 × 物资效率 × [tv_wonder_logistics_competence|e]乘数（50% 到 150%）。卡片底部会用你自己的数字把同一道算式列出来。"
 TV_EU_OVERVIEW_S6_R4_TITLE:0 "底部的连乘式"
 TV_EU_OVERVIEW_S6_R5_TEXT:0 "卡片只负责汇报。要真的把工地建起来得点这条按钮，在此之前所有进度数字都是零。"
 TV_EU_OVERVIEW_S6_R5_TITLE:0 "建工地是另一步"
 TV_EU_OVERVIEW_S6_TITLE:0 "第五步 组织和物流"
 TV_EU_OVERVIEW_S7_BODY:0 "同一时间只推进一个[tv_wonder_construction_part|e]，默认自动选进度最落后的那个。你也可以点「建设基础」「建设主体」「建设功能」「建设封顶装饰」手动切换，但切换会清零当前这一单元的进度。"
 TV_EU_OVERVIEW_S7_R1_TEXT:0 "每个部件都是一排单元按钮：绿色是已完成，黄色是正在建的那个，红色是还排着的。只有黄色那一行在动。"
 TV_EU_OVERVIEW_S7_R1_TITLE:0 "四行部件，各有各的单元"
 TV_EU_OVERVIEW_S7_R2_TEXT:0 "这四个切换按钮会覆盖自动选择，代价是当前单元的进度清零。所以只有顺序真的重要时才手动切。"
 TV_EU_OVERVIEW_S7_R2_TITLE:0 "手动切换要付代价"
 TV_EU_OVERVIEW_S7_R3_TEXT:0 "奇观等级等于最落后的那个部件，这正是切换按钮存在的理由。只把一个部件做到极致，等级不会升。"
 TV_EU_OVERVIEW_S7_R3_TITLE:0 "等级取最弱的那个部件"
 TV_EU_OVERVIEW_S7_R4_TEXT:0 "只有等级比开工时至少高一级，这条按钮才会亮。点下去，建设阶段就永久结束。"
 TV_EU_OVERVIEW_S7_R4_TITLE:0 "完工的定义是涨了一级"
 TV_EU_OVERVIEW_S7_TITLE:0 "第六步 建设"
 TV_EU_OVERVIEW_S8_BODY:0 "建成后进入[tv_wonder_ceremony|e]阶段，有两种选择。"
 TV_EU_OVERVIEW_S8_R1_TEXT:0 "详情面板上方的风格按钮只是预览。点它们不花钱、也不改变任何状态，所以尽管挨个点开，把预期效果念完再决定。风格是按奇观定的：「王室献祭」「冥想典礼」「神圣授职」只是第一座工程的选项。"
 TV_EU_OVERVIEW_S8_R1_TITLE:0 "三种风格，免费比较"
 TV_EU_OVERVIEW_S8_R2_TEXT:0 "每种风格列出它的奖励，以及哪些阶层支持、哪些反对。支持的阶层[estate_satisfaction|e] +0.10，其余 −0.05。这些在确认时一次性结算，不是逐月变化。"
 TV_EU_OVERVIEW_S8_R2_TITLE:0 "预览里能看到什么"
 TV_EU_OVERVIEW_S8_R3_TEXT:0 "「举行仪式」按小、中、大规模支付 2、3、5 倍缩放[gold|e]，24 个月后落成。「以朴素方式落成」立刻完成且不花钱，代价是 −0.05 满意度，并进入[tv_wonder_plain|e]状态。"
 TV_EU_OVERVIEW_S8_R3_TITLE:0 "两种收尾，一种免费"
 TV_EU_OVERVIEW_S8_R4_TEXT:0 "朴素奇观以后还能补办仪式：在构想阶段使用[decision|e]「重新奉献奇观」，或者在地点面板点「为此工程重新举行仪式」。"
 TV_EU_OVERVIEW_S8_R4_TITLE:0 "朴素落成不是死路"
 TV_EU_OVERVIEW_S8_TITLE:0 "第七步 仪式"
 TV_EU_OVERVIEW_TITLE:0 "伟大工程"
 TV_EU_SETTINGS_LEAD:0 "本模组带有一整套调整菜单，供想直接要纪念碑、不愿谈判的玩家使用。其中每一项都是可选的，默认全部关闭。"
 TV_EU_SETTINGS_S1_E1_TEXT:0 "构想、辩论与勘测均可自动完成，施工也可直接抬到六级。用来测试效果很方便，用来玩则毁掉全部张力。"
 TV_EU_SETTINGS_S1_E1_TITLE:0 "跳过阶段"
 TV_EU_SETTINGS_S1_E2_TEXT:0 "无限规模让任何地基都能建到六级；无限组织让任何营地都能建到 20 级。两者合用，等于把地理从限制条件里删掉。"
 TV_EU_SETTINGS_S1_E2_TITLE:0 "解除上限"
 TV_EU_SETTINGS_S1_E3_TEXT:0 "直接建造的价格、每单元进度需求，以及随机的施工与勘测事件，都可调整或关闭。"
 TV_EU_SETTINGS_S1_E3_TITLE:0 "价格与节奏"
 TV_EU_SETTINGS_S1_E4_TEXT:0 "选定风格后可即时免费确认，通用奇观与独特奇观皆然。"
 TV_EU_SETTINGS_S1_E4_TITLE:0 "跳过仪式"
 TV_EU_SETTINGS_S1_TITLE:0 "可以改变什么"
 TV_EU_SETTINGS_TITLE:0 "设置与调整"
 TV_EU_SIZES_LEAD:0 "三种规模，三种价格、三种节奏，以及一条关于「此后能拿它怎么办」的重要区别。"
 TV_EU_SIZES_S1_A1_TEXT:0 "每单元最便宜，也是唯一可以重复建造的规模。其全国效果仅限于推动某项数值，以免它单独成为无限经济。"
 TV_EU_SIZES_S1_A1_TITLE:0 "小型"
 TV_EU_SIZES_S1_A2_TEXT:0 "每种每国仅限一座，没有例外，但全国与地方效果不受限制。举一代之力成一座纪念碑。"
 TV_EU_SIZES_S1_A2_TITLE:0 "中型与大型"
 TV_EU_SIZES_S1_SIGN:0 "或"
 TV_EU_SIZES_S1_TITLE:0 "三者之比"
 TV_EU_SIZES_S2_BODY:0 "$BULLET$ #T 仪式价格：#!分别为 2、3、5 倍缩放金。\n$BULLET$ #T 每单元成本：#!按游戏自带参考价格，每级约为一万、两万、三万金币。\n$BULLET$ #T 进度需求：#!每个施工单元对营地的要求更高。\n$BULLET$ #T 重复：#!小型可在别处重建，中型与大型完全不可复制。"
 TV_EU_SIZES_S2_TITLE:0 "规模改变了什么"
 TV_EU_SIZES_S3_BODY:0 "总工程师只会提出国家承受得起的方案，所以选择通常是「建得完的规模」与「只能开工的规模」之间。一座停在二级就放弃的大型奇观，比一座四级落成的小型奇观更糟：空壳不产生任何效果，而阶层会记住这次失败。\n\n只有在你确定不会被打断时才选大型：稳固的首都、充裕的国库，以及一位能活着看到它完工的总工程师。"
 TV_EU_SIZES_S3_TITLE:0 "如何选择规模"
 TV_EU_SIZES_TITLE:0 "工程规模"
 TV_EU_SUPPORT_LEAD:0 "支持度在勘测与施工期间持续衰减。耗尽时朝廷会给一次挽回的机会；再之后，工程即告结束。"
 TV_EU_SUPPORT_S1_P1_TEXT:0 "辩论结束不久，支持度便每月下滑。工程中没有别的东西会消耗它。"
 TV_EU_SUPPORT_S1_P1_TITLE:0 "支持度衰减"
 TV_EU_SUPPORT_S1_P2_TEXT:0 "若工程此时已可宣布建成，就直接收工。否则，这才是开始疼的地方。"
 TV_EU_SUPPORT_S1_P2_TITLE:0 "归零"
 TV_EU_SUPPORT_S1_P3_TEXT:0 "收买所有阶层，或由君主公开表态。两者都给 +50 支持度，工程继续。"
 TV_EU_SUPPORT_S1_P3_TITLE:0 "一次挽救"
 TV_EU_SUPPORT_S1_P4_TEXT:0 "没有第三次。工程终止：总工程师被处死，威望与阶层好感随之失去。"
 TV_EU_SUPPORT_S1_P4_TITLE:0 "第二次"
 TV_EU_SUPPORT_S1_TITLE:0 "失败之路"
 TV_EU_SUPPORT_S2_E1_TEXT:0 "相当于十二个月的贸易与税收收入，在本国所有阶层间均分，下限 100 金币。昂贵但立竿见影。"
 TV_EU_SUPPORT_S2_E1_TITLE:0 "收买阶层"
 TV_EU_SUPPORT_S2_E2_TEXT:0 "#high 50 政治影响力#! 与 #high 25 威望#!。金币上更便宜，但付出的是君主无法凭空铸造的东西。"
 TV_EU_SUPPORT_S2_E2_TITLE:0 "公开表态"
 TV_EU_SUPPORT_S2_E3_TEXT:0 "主动放弃的代价与失败相同。若工地已失、国家已破产，有时诚实的答案就是放手。"
 TV_EU_SUPPORT_S2_E3_TITLE:0 "放弃"
 TV_EU_SUPPORT_S2_TITLE:0 "两种挽救"
 TV_EU_SUPPORT_TITLE:0 "工程失败时"
 TV_EU_SURVEY_LEAD:0 "勘测是地基反过来向你提出异议的环节。你选定地点，勘测师读出它真正能承载什么，而这些读数将在此后整段工程中封顶。"
 TV_EU_SURVEY_S1_P1_TEXT:0 "任何满足该奇观选址规则的自有地点。部门面板会列出符合条件的那些。"
 TV_EU_SURVEY_S1_P1_TITLE:0 "选择地点"
 TV_EU_SURVEY_S1_P2_TEXT:0 "勘测进度以每月 #high 1/10#! 军事能力增长，直至 100。"
 TV_EU_SURVEY_S1_P2_TITLE:0 "进度积累"
 TV_EU_SURVEY_S1_P3_TEXT:0 "规模、组织与后勤各自计量：天然适宜度加上总工程师的行政能力。"
 TV_EU_SURVEY_S1_P3_TITLE:0 "读数"
 TV_EU_SURVEY_S1_P4_TEXT:0 "确认之后，工地与读数即固定。一旦动工便无法再提升。"
 TV_EU_SURVEY_S1_P4_TITLE:0 "锁定工地"
 TV_EU_SURVEY_S1_TITLE:0 "选定地基"
 TV_EU_SURVEY_S2_BODY:0 "换一处地点不花钱，而且往往值得一做：一个有良港的沿海城市，读数会远远好过内陆村庄，而勘测进度是整个工程里最便宜的可重复项。\n\n真正让你付出的是确认工地。确认之前放弃的地基，从未算作花费。"
 TV_EU_SURVEY_S2_TITLE:0 "重新勘测"
 TV_EU_SURVEY_TITLE:0 "勘测"
 TV_EU_TAB_TITLE:0 "伟大工程"
