 tv_wonder_ownership.800.t:0 "[tv_wonder_construction|E]: Weltwunder gesichert"
 tv_wonder_ownership.800.d:0 "Die neu erworbene Provinz [SCOPE.sLocation('tv_wonder_ownership_site').GetName] enthält ein abgeschlossenes [tv_wonder_construction|E]. Seine Basiseffekte entsprechen jetzt unserer Regel, und unsere Ingenieure haben es als möglichen Erweiterungsort erfasst, wenn sein erhaltener Maßstab weitere Arbeiten zulässt.\n\n#weak Das Wunder gehört jetzt uns – überprüfen Sie seine Auswirkungen in der Technikabteilung und überlegen Sie, ob es weiter erweitert werden kann.#!"
 tv_wonder_ownership.800.a:0 "Setzen Sie es in die Tat um."
 tv_wonder_ownership.900.t:0 "[tv_wonder_construction|E]: Ein verlorenes Weltwunder"
 tv_wonder_ownership.900.d:0 "Da [SCOPE.sLocation('tv_wonder_ownership_site').GetName] verloren geht, unterstützt das fertige [tv_wonder_construction|E] dort unseren Bereich nicht mehr. Alle permanenten nationalen Zeremonienvorteile, die nur mit diesem Wunder verbunden sind, wurden aus unseren Büchern entfernt.\n\n#weak Mit dem Verlust der Provinz sind die festen Vorteile des Wunders verloren – wenn es später wieder eingenommen wird, überprüfen Sie seinen Status in der Ingenieursabteilung.#!"
 tv_wonder_ownership.900.a:0 "Wir müssen es zurückgewinnen!"
 tv_wonder_ownership.800.b:0 "Strip it bare."
 tv_wonder_ownership.900.d_preserved:0 "[SCOPE.sCountry('winner').GetName] has chosen to spare [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. The site is ours no longer, but the monument stands as it always has."
 tv_wonder_ownership.900.d_plundered:0 "[SCOPE.sCountry('winner').GetName] has plundered [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. Its treasures now fill their coffers, and the wonder has lost a level. If it was down to its last level, nothing of it remains."
 tv_wonder_ownership.900.d_stale:0 "[SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName] has passed out of our hands, yet no decision on its fate has taken effect. Either the site found no new master, or it changed hands again, or the wonder itself changed, before any such decision could be carried out."
