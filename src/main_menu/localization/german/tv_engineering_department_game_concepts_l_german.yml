 # ── Engineering Department / Wonder Construction ──────────────────────────
 game_concept_tv_engineering_department: "Ingenieurabteilung"
 game_concept_tv_engineering_department_desc: "Eine nicht eindeutige internationale Organisation, die bei der Kampagneninitialisierung automatisch für jedes Land eingerichtet wird. Es hält das [tv_great_engineer|e]-Büro und verwaltet jede Phase eines [tv_wonder_construction|e]: [tv_wonder_concept|e], Standort [tv_wonder_survey|e], Organisation, Logistik und abschließendes [tv_wonder_ceremony|e]."

 game_concept_tv_great_engineer: "Großartiger Ingenieur"
 game_concept_tv_great_engineer_desc: "Der ernannte Charakter, der das [tv_engineering_department|e] leitet. Der [tv_great_engineer|e] wird als Ländervariable gespeichert und kann im [tv_engineering_department|e]-Panel ernannt, ersetzt oder entlassen werden."

 game_concept_tv_wonder_concept: "Konzeption"
 game_concept_tv_wonder_concept_desc: "Die Angebotsphase, die ein neues [tv_wonder_construction|e] öffnet. Jeden Monat fördert die administrative Fähigkeit des [tv_great_engineer|e] den Empfängnisfortschritt; Sobald es abgeschlossen ist, schlägt der [tv_great_engineer|e] ein realisierbares [tv_wonder_small|e]-, [tv_wonder_medium|e]- oder [tv_wonder_large|e]-Projekt vor, das das Land verfolgen kann."

 game_concept_tv_wonder_survey: "Umfrage"
 game_concept_tv_wonder_survey_desc: "Die Standortbewertungsphase von [tv_wonder_construction|e]. Der Vermessungsfortschritt steigt monatlich anhand der militärischen Fähigkeiten des [tv_great_engineer|e], deckt [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] und [tv_wonder_organization_competence|e] auf und ermöglicht dem Land, eine Baustelle zu bestätigen, sobald die Messungen abgeschlossen sind."

 game_concept_tv_wonder_debate: "Debatte"
 game_concept_tv_wonder_debate_desc: "Die inländische Debattenphase von [tv_wonder_construction|e]. Befriedigung von Immobilienanforderungen und Diskussionsveranstaltungen baut [tv_wonder_domestic_support|e] auf; Sobald der Wert 100 erreicht, kann das Land die Debatte für beendet erklären und mit [tv_wonder_survey|e] fortfahren."


 game_concept_tv_wonder_ceremony: "Zeremonie"
 game_concept_tv_wonder_ceremony_desc:0 "The dedication of a completed Great Project. Generic and unique wonders offer three styles or a plain inauguration. Dedication is recorded independently from the final building; its rewards and societal tendency end when the wonder is lost or its dedication fades."

 game_concept_tv_wonder_construction: "Tolles Projekt"
 game_concept_tv_wonder_construction_desc: "Ein großartiger Projektmechanismus, der über [tv_engineering_department|e] verwaltet wird. Sobald das [tv_great_engineer|e] und das [tv_wonder_concept|e] ein realisierbares [tv_wonder_small|e]-, [tv_wonder_medium|e]- oder [tv_wonder_large|e]-Projekt hervorbringen und das Land die innenpolitische Debatte beilegt, schließt es ein [tv_wonder_survey|e] ab, organisiert die Arbeitskräfte, sammelt [tv_wonder_materials|e] und bringt vier [tv_wonder_construction_part|e] voran das Projekt auf sein endgültiges Niveau zu heben."

 game_concept_tv_wonder_expansion: "Erweiterung"
 game_concept_tv_wonder_expansion_desc:0 "Raise an inaugurated wonder at the same site. A dedicated wonder retains its dedication and skips the ritual phase without repeating ritual rewards. A plain wonder may choose a dedication or remain plain after expansion. Preserved survey competence and base construction rewards follow the usual rules."

 game_concept_tv_wonder_construction_part: "Konstruktionsteil"
 game_concept_tv_wonder_construction_part_desc: "Eine der vier parallelen Spuren – Fundament, Hauptstruktur, Funktion und Krönung – die ein [tv_wonder_construction|e] gleichzeitig voranschreitet. Das Niveau des Projekts wird dadurch bestimmt, welcher der vier Teile am weitesten hinterherhinkt, daher muss der Fortschritt gleichmäßig verteilt werden und darf nicht auf einer einzigen Schiene beschleunigt werden."

 game_concept_tv_wonder_small: "Kleines Projekt"
 game_concept_tv_wonder_small_desc: "A [tv_wonder_construction|e] size class. Small projects may be built more than once. Their base country effect is limited to value movement, while local effects and ceremony effects are unrestricted.\nEach level of a small project typically costs about #Y 10,000@gold!#!."

 game_concept_tv_wonder_medium: "Mittleres Projekt"
 game_concept_tv_wonder_medium_desc: "A [tv_wonder_construction|e] size class between small and large projects. A country may not start a second medium project of the same type, but its base country effects, local effects, and ceremony effects are unrestricted.\nEach level of a medium project typically costs about #Y 20,000@gold!#!."

 game_concept_tv_wonder_large: "Großes Projekt"
 game_concept_tv_wonder_large_desc: "A [tv_wonder_construction|e] size class. A country may not start a second large project of the same type, but its base country effects, local effects, and ceremony effects are unrestricted.\nEach level of a large project typically costs about #Y 30,000@gold!#!."

 game_concept_tv_wonder_generic: "Generisches Wunder"
 game_concept_tv_wonder_generic_desc: "Ein vom [tv_wonder_construction|e] vorgeschlagener [tv_great_engineer|e], der sich frei im Maßstab [tv_wonder_small|e], [tv_wonder_medium|e] oder [tv_wonder_large|e] befindet, im Gegensatz zu einem auf der Karte fixierten [tv_wonder_unique|e]. Bei seiner Einführung können Sie einen [tv_wonder_ceremony|e]-Stil wählen."

 game_concept_tv_wonder_unique: "Einzigartiges Wunder"
 game_concept_tv_wonder_unique_desc: "Ein historischer [tv_wonder_construction|e], der an einem bestimmten Standort auf der Karte fixiert ist, im Gegensatz zu einem frei platzierten [tv_wonder_generic|e]. Die meisten einzigartigen Wunder durchlaufen automatisch einen 8-stufigen [tv_wonder_ceremony|e], sobald der Bau abgeschlossen ist; Einige haben stattdessen ihre eigene manuelle Zeremonie."

 game_concept_tv_wonder_domestic_support: "Inländische Unterstützung"
 game_concept_tv_wonder_domestic_support_desc: "Eine [tv_wonder_construction|e]-Ressource, die die Bereitschaft der Elite und der Öffentlichkeit repräsentiert, ein großes Großprojekt aufrechtzuerhalten. Erreichen Sie 100, um die erste Debatte zu beenden; Die Unterstützung kann bis zu 200 gespeichert werden und fällt nach Ende der Debatte ab."

 game_concept_tv_wonder_scale_competence: "Skalierungskompetenz"
 game_concept_tv_wonder_scale_competence_desc: "Ein [tv_wonder_survey|e]-Wert, der zeigt, wie gut der ausgewählte Standort die geplante Größe, Achsen, Fundamente und öffentliche Ausrichtung des Projekts tragen kann, ohne den Entwurf in eine unangenehme Form zu zwingen. Die maximale Stufe \"Großartiges Projekt\" wird auf 20 %, 40 %, 60 %, 80 % und 100 % festgelegt, wobei Stufe 6 100 % erfordert."

 game_concept_tv_wonder_organization_competence: "Organisationskompetenz"
 game_concept_tv_wonder_organization_competence_desc: "Eine [tv_wonder_survey|e]-Messung, die zeigt, wie sauber Arbeitspläne, Vorarbeiter, Werkstätten und Bauphasen erstellt werden können, um einem Plan statt vielen konkurrierenden Aufträgen gerecht zu werden. Es legt die maximale Great Project Worksite-Stufe linear von 0 bis 20 fest."

 game_concept_tv_wonder_logistics_competence: "Logistikkompetenz"
 game_concept_tv_wonder_logistics_competence_desc: "Ein [tv_wonder_survey|e]-Messwert für Straßen, Karren, Häfen, Brücken und Übergabepunkte, der bestimmt, ob [tv_wonder_materials|e] die Baustelle erreicht, wenn die Maurer sie benötigen."

 # ── Europedia Tab UI ─────────────────────────────────────────────────────────────────────────
 game_concept_tv_wonder_materials: "$tv_wonder_materials$"
 game_concept_tv_wonder_materials_desc: "Ein produziertes Marktgut, das zur Aufrechterhaltung von $tv_wonder_labor_camp$ während eines aktiven [tv_wonder_construction|e] verwendet wird. Jeder $tv_wonder_material_dispatch_point$ wandelt grundlegende Baugüter in [tv_wonder_materials|e] um, sodass Angebot und Preis über den normalen Markt abgewickelt werden."
 game_concept_tv_wonder_plain: "Plain"
 game_concept_tv_wonder_plain_desc: "The state of a [tv_wonder_construction|e] after skipping the [tv_wonder_ceremony|e] phase. Provides no [tv_wonder_ceremony|e] bonuses."
