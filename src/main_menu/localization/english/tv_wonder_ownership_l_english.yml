 tv_wonder_ownership.800.d:0 "[SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName], a [tv_wonder_construction|E], now stands within our newly won [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. We may spare it and earn prestige as its custodians, or strip its treasures to fill our coffers, at the cost of one level. A wonder with but a single level left will not survive the plundering. Whatever we choose, its former masters will hear of it."
