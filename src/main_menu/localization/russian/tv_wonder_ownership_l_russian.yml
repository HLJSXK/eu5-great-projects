 tv_wonder_ownership.800.t:0 "[tv_wonder_construction|E]：Чудо света обеспечено"
 tv_wonder_ownership.800.d:0 "Недавно приобретенная провинция [SCOPE.sLocation('tv_wonder_ownership_site').GetName] содержит завершенный [tv_wonder_construction|E]. Его базовые эффекты теперь соответствуют нашему правилу, и наши инженеры записали его как возможное место для расширения, если его сохранившийся масштаб позволит продолжить работу.\n\n#weak Чудо теперь принадлежит нам — просмотрите его эффекты в Инженерном отделе и подумайте, можно ли его расширить дальше.#!"
 tv_wonder_ownership.800.a:0 "Заставьте это работать."
 tv_wonder_ownership.900.t:0 "[tv_wonder_construction|E]: Потерянное чудо света"
 tv_wonder_ownership.900.d:0 "После потери [SCOPE.sLocation('tv_wonder_ownership_site').GetName] завершенный [tv_wonder_construction|E] больше не поддерживает нашу область. Любые постоянные преимущества национальных церемоний, связанные только с этим чудом, были изъяты из наших бухгалтерских книг. \n\n#weak После потери провинции фиксированные преимущества чуда исчезнут — если оно будет получено повторно позже, подтвердите его статус в Инженерном департаменте.#!"
 tv_wonder_ownership.900.a:0 "Мы должны вернуть это!"
 tv_wonder_ownership.800.b:0 "Strip it bare."
 tv_wonder_ownership.900.d_preserved:0 "[SCOPE.sCountry('winner').GetName] has chosen to spare [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. The site is ours no longer, but the monument stands as it always has."
 tv_wonder_ownership.900.d_plundered:0 "[SCOPE.sCountry('winner').GetName] has plundered [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. Its treasures now fill their coffers, and the wonder has lost a level. If it was down to its last level, nothing of it remains."
 tv_wonder_ownership.900.d_stale:0 "[SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName] has passed out of our hands, yet no decision on its fate has taken effect. Either the site found no new master, or it changed hands again, or the wonder itself changed, before any such decision could be carried out."
