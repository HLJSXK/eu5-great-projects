 # ── Engineering Department / Wonder Construction ──────────────────────────
 game_concept_tv_engineering_department: "Инженерный отдел"
 game_concept_tv_engineering_department_desc: "Неуникальная международная организация, автоматически создаваемая для каждой страны во время инициализации кампании. Он занимает офис [tv_great_engineer|e] и управляет каждым этапом [tv_wonder_construction|e]: [tv_wonder_concept|e], площадкой [tv_wonder_survey|e], организацией, логистикой и финальным [tv_wonder_ceremony|e]."

 game_concept_tv_great_engineer: "Великий инженер"
 game_concept_tv_great_engineer_desc: "Назначенный персонаж, возглавляющий [tv_engineering_department|e]. [tv_great_engineer|e] хранится как переменная страны и может быть назначена, заменена или отменена с панели [tv_engineering_department|e]."

 game_concept_tv_wonder_concept: "Концепция"
 game_concept_tv_wonder_concept_desc: "Этап предложения, открывающий новый [tv_wonder_construction|e]. Каждый месяц административные навыки [tv_great_engineer|e] улучшают прогресс концепции; После его завершения [tv_great_engineer|e] предлагает стране осуществимый проект [tv_wonder_small|e], [tv_wonder_medium|e] или [tv_wonder_large|e]."

 game_concept_tv_wonder_survey: "Опрос"
 game_concept_tv_wonder_survey_desc: "Этап оценки объекта [tv_wonder_construction|e]. Прогресс исследования увеличивается ежемесячно благодаря военным навыкам [tv_great_engineer|e], выявляет [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] и [tv_wonder_organization_competence|e] и позволяет стране подтвердить строительную площадку после завершения измерений."

 game_concept_tv_wonder_debate: "Дебаты"
 game_concept_tv_wonder_debate_desc: "Этап внутренних дебатов по [tv_wonder_construction|e]. Удовлетворение требований поместья и дебатов строит [tv_wonder_domestic_support|e]; как только оно достигнет 100, страна может объявить дебаты завершенными и перейти к [tv_wonder_survey|e]."


 game_concept_tv_wonder_ceremony: "Церемония"
 game_concept_tv_wonder_ceremony_desc:0 "The dedication of a completed Great Project. Generic and unique wonders offer three styles or a plain inauguration. Dedication is recorded independently from the final building; its rewards and societal tendency end when the wonder is lost or its dedication fades."

 game_concept_tv_wonder_construction: "Отличный проект"
 game_concept_tv_wonder_construction_desc: "Механика великого проекта под управлением [tv_engineering_department|e]. [tv_great_engineer|e] завершает [tv_wonder_concept|e] и предлагает проект [tv_wonder_small|e], [tv_wonder_medium|e] или [tv_wonder_large|e]; после внутреннего [tv_wonder_debate|e] и [tv_wonder_survey|e] развиваются четыре [tv_wonder_construction_part|e]. Каждый $tv_wonder_labor_camp$ потребляет инструменты, древесину и камень с местного рынка."

 game_concept_tv_wonder_expansion: "Расширение"
 game_concept_tv_wonder_expansion_desc:0 "Raise an inaugurated wonder at the same site. A dedicated wonder retains its dedication and skips the ritual phase without repeating ritual rewards. A plain wonder may choose a dedication or remain plain after expansion. Preserved survey competence and base construction rewards follow the usual rules."

 game_concept_tv_wonder_construction_part: "Строительная часть"
 game_concept_tv_wonder_construction_part_desc: "Один из четырех параллельных треков — \"Фундамент\", \"Основная структура\", \"Функция\" и \"Венчание\", — который [tv_wonder_construction|e] продвигает одновременно. Уровень проекта определяется тем, какая из четырех частей отстает больше всего, поэтому прогресс должен распределяться равномерно, а не торопиться по одному пути."

 game_concept_tv_wonder_small: "Малый проект"
 game_concept_tv_wonder_small_desc: "Размерный класс [tv_wonder_construction|e]. Небольшие проекты могут быть построены более одного раза. Их эффект базовой страны ограничен перемещением стоимости, в то время как местные эффекты и эффекты церемоний не ограничены. \nКаждый уровень небольшого проекта обычно стоит около #Y 10,000@gold!#!."

 game_concept_tv_wonder_medium: "Средний проект"
 game_concept_tv_wonder_medium_desc: "Класс размеров [tv_wonder_construction|e] между малыми и большими проектами. Страна не может начать второй средний проект того же типа, но его эффекты базовой страны, местные эффекты и эффекты церемоний не ограничены. \nКаждый уровень среднего проекта обычно стоит около #Y 20 000@gold!#!."

 game_concept_tv_wonder_large: "Большой проект"
 game_concept_tv_wonder_large_desc: "Размерный класс [tv_wonder_construction|e]. Страна не может начать второй крупный проект того же типа, но эффекты его базовой страны, местные эффекты и эффекты церемоний не ограничены. \nКаждый уровень большого проекта обычно стоит около #Y 30 000@gold!#!."

 game_concept_tv_wonder_generic: "Общее чудо"
 game_concept_tv_wonder_generic_desc: "[tv_wonder_construction|e], предложенный [tv_great_engineer|e] и свободно расположенный в масштабе [tv_wonder_small|e], [tv_wonder_medium|e] или [tv_wonder_large|e], в отличие от [tv_wonder_unique|e], зафиксированного на карте. Его открытие позволит вам выбрать стиль [tv_wonder_ceremony|e]."

 game_concept_tv_wonder_unique: "Уникальное чудо"
 game_concept_tv_wonder_unique_desc: "Исторический [tv_wonder_construction|e], зафиксированный в определенном месте на карте, в отличие от свободно расположенного [tv_wonder_generic|e]. Большинство уникальных чудес автоматически проходят через 8-ступенчатый [tv_wonder_ceremony|e] после завершения строительства; вместо этого у некоторых есть собственная специальная ручная церемония."

 game_concept_tv_wonder_domestic_support: "Внутренняя поддержка"
 game_concept_tv_wonder_domestic_support_desc: "Ресурс [tv_wonder_construction|e], отражающий готовность элиты и общественности поддержать крупный Великий Проект. Достигните 100, чтобы завершить начальные дебаты; поддержка может храниться до 200 и затухает после окончания дебатов."

 game_concept_tv_wonder_scale_competence: "Масштабируйте компетентность"
 game_concept_tv_wonder_scale_competence_desc: "Оценка [tv_wonder_survey|e], позволяющая определить, насколько хорошо выбранное место может соответствовать предполагаемому размеру проекта, его осям, фундаменту и общественному подходу, не придавая проекту неуклюжей формы. Он устанавливает максимальный уровень Великого проекта на уровне 20%, 40%, 60%, 80% и 100%, при этом уровень 6 требует 100%."

 game_concept_tv_wonder_organization_competence: "Организационная компетентность"
 game_concept_tv_wonder_organization_competence_desc: "Чтение [tv_wonder_survey|e] о том, насколько четко можно организовать списки рабочей силы, мастеров, мастерских и этапов строительства, чтобы выполнять один план, а не множество конкурирующих заказов. Он линейно устанавливает максимальный уровень Great Project Worksite от 0 до 20."

 game_concept_tv_wonder_logistics_competence: "Логистическая компетентность"
 game_concept_tv_wonder_logistics_competence_desc: "Оценка дорог, повозок, портов, мостов и пунктов передачи, определяющая своевременность доставки товаров на стройку."

