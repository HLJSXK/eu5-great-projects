 tv_wonder_ownership.800.t:0 "[tv_wonder_construction|E]: Dünya Harikası Güvenli"
 tv_wonder_ownership.800.d:0 "Yeni satın alınan [SCOPE.sLocation('tv_wonder_ownership_site').GetName] eyaleti tamamlanmış bir [tv_wonder_construction|E] içeriyor. Temel etkileri artık kuralımıza uyuyor ve mühendislerimiz, korunmuş ölçeği daha fazla çalışmaya izin veriyorsa burayı olası bir genişleme alanı olarak kaydetti.\n\n#weak Bu mucize artık bize ait — Mühendislik Departmanında etkilerini inceleyin ve daha da genişletilip genişletilemeyeceğini değerlendirin.#!"
 tv_wonder_ownership.800.a:0 "Çalıştırın."
 tv_wonder_ownership.900.t:0 "[tv_wonder_construction|E]: Kayıp Bir Dünya Harikası"
 tv_wonder_ownership.900.d:0 "[SCOPE.sLocation('tv_wonder_ownership_site').GetName] kaybolduğunda, tamamlanan [tv_wonder_construction|E] artık bizim alanımızı desteklemiyor. Yalnızca o harikaya bağlı tüm kalıcı ulusal tören avantajları, defterlerimizden geri çekildi.\n\n#weak Eyaletin kaybedilmesiyle, harikanın sabit faydaları da ortadan kalkar; daha sonra tekrar alınırsa, Mühendislik Departmanındaki durumunu onaylayın.#!"
 tv_wonder_ownership.900.a:0 "Kaybı kaydedin."
 tv_wonder_ownership.800.b:0 "Strip it bare."
 tv_wonder_ownership.900.d_preserved:0 "[SCOPE.sCountry('winner').GetName] has chosen to spare [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. The site is ours no longer, but the monument stands as it always has."
 tv_wonder_ownership.900.d_plundered:0 "[SCOPE.sCountry('winner').GetName] has plundered [SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName]. Its treasures now fill their coffers, and the wonder has lost a level. If it was down to its last level, nothing of it remains."
 tv_wonder_ownership.900.d_stale:0 "[SCOPE.sBuildingType('tv_wonder_ownership_building_type').GetName] in [SCOPE.sLocation('tv_wonder_ownership_site').GetName] has passed out of our hands, yet no decision on its fate has taken effect. Either the site found no new master, or it changed hands again, or the wonder itself changed, before any such decision could be carried out."
